<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akyuu · Topics</title>
<style>/*AKYUU-FONTS*/
:root{color-scheme:light dark;--paper:#fcfaf6;--ink:#252838;--muted:#686c7e;--line:#dedde7;--accent:#575f9e;--card:#fff;--warn:#a64b3d;--wash:#efedf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Shippori Mincho B1",Georgia,serif}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}button,input,.label,aside,small,.meta{font-family:"Spline Sans Mono",monospace}button{cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}button:hover,button[aria-current=true]{border-color:var(--accent);background:var(--wash)}main{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1450px;margin:auto;min-height:80vh}aside{border-right:1px solid var(--line);padding:22px 16px}aside button{display:block;width:100%;text-align:left;margin:0 0 8px;overflow-wrap:anywhere;font-size:12px}.workspace{padding:28px 36px}form{display:flex;gap:8px;margin:0 0 24px}input{min-width:0;flex:1;padding:10px 12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h2{font-size:25px;margin:7px 0 14px;overflow-wrap:anywhere}h3{font-size:18px;margin:4px 0 10px}.notice{padding:14px 18px;background:var(--wash);border-left:3px solid var(--accent);margin:14px 0}.warning{border-color:var(--warn)}.head{background:var(--card);border:1px solid var(--line);padding:20px 24px;margin:16px 0;border-radius:8px}.head p{white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}details{margin-top:20px}summary{cursor:pointer}.context{margin-top:36px;border-top:1px solid var(--line);padding-top:20px}.error{color:var(--warn)}a{color:var(--accent)}.links button{margin:4px 6px 0 0;font-size:11px}.empty{color:var(--muted)}#snapshot{font-size:10px;color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(prefers-color-scheme:dark){:root{--paper:#181b28;--ink:#e8e4ed;--muted:#a4a8bd;--line:#35394d;--accent:#b3b9ed;--card:#212536;--warn:#eea397;--wash:#292d43}}@media(max-width:720px){header{padding:18px}main{display:block}aside{border-right:0;border-bottom:1px solid var(--line);max-height:220px;overflow:auto}.workspace{padding:22px 18px}aside button{display:inline-block;width:auto;margin:3px}form{flex-wrap:wrap}input{flex-basis:60%}}
.meta{white-space:pre-wrap}
</style></head><body>
<header><div><div class="label">A chronicler’s page · Read only</div><h1>akyuu / Topics</h1></div><div><button id="refresh" type="button">Refresh</button><div id="snapshot"></div></div></header>
<main><aside aria-label="Topics"><div class="label">Current topics</div><div id="topics"></div></aside><section class="workspace"><form id="search-form"><input id="query" aria-label="Search current topics" placeholder="Search current topics…"><button id="search-submit">Search</button><button id="clear" type="button">Clear</button></form><div id="error" role="alert" class="error"></div><div id="results" aria-live="polite"></div><section id="detail"></section><section id="context" class="context"></section></section></main>
<!--AKYUU-DATA-->
<script>
'use strict';
const $=id=>document.getElementById(id);
let bundle=null, selected=null, requestNumber=0;
const embedded=document.getElementById('akyuu-data');
const isStatic=!!embedded;
function element(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function showTopic(topic,container){
  container.append(element('div',topic.status,'label'),element('h2',topic.topic));
  if(topic.status==='conflict'||topic.status==='type-conflict')container.append(element('div','Concurrent versions — review every head before resolution. No version is selected.','notice warning'));
  if(topic.status==='missing')container.append(element('p','This topic is missing.','empty'));
  for(const head of topic.heads){const card=element('article',undefined,'head');card.append(element('div',`${head.kind} · ${head.agent}`,'label'),element('p',head.body));const meta=element('details');meta.append(element('summary','Version details'),element('div',`Memory ${head.memory}\nEvent ${head.event}\nCreated ${head.created}\nAction ${head.recorded_at}\nReplica ${head.replica}`,'meta'));card.append(meta);const links=element('div',undefined,'links');for(const ref of head.about_refs||[]){const button=element('button',ref);button.type='button';button.addEventListener('click',()=>{selected=ref;render();});links.append(button);}card.append(links);container.append(card);}
  const version=element('details');version.append(element('summary','Topic version'),element('div',topic.version,'meta'));container.append(version);
}
function render(){
  $('error').textContent='';$('topics').replaceChildren();$('detail').replaceChildren();$('results').replaceChildren();$('context').replaceChildren();
  $('snapshot').textContent=`Snapshot ${bundle.checkpoint.slice(7,19)}`;
  for(const topic of bundle.topics){const button=element('button',`${topic.topic}${topic.status.includes('conflict')?' · conflict':''}`);button.type='button';button.setAttribute('aria-current',String(topic.topic===selected));button.addEventListener('click',()=>{selected=topic.topic;render();});$('topics').append(button);}
  if(!bundle.topics.length)$('topics').append(element('p','No topics yet.','empty'));
  if(bundle.search){$('results').append(element('div',`${isStatic?'Filter':'Search'}: ${bundle.search.query}`,'label'));if(!bundle.search.hits.length)$('results').append(element('p','No current topic matched.','empty'));for(const hit of bundle.search.hits){const button=element('button',`${hit.topic.topic} · ${hit.topic.status}`);button.type='button';button.addEventListener('click',()=>{selected=hit.topic.topic;render();});$('results').append(button);} }
  const topic=bundle.topics.find(topic=>topic.topic===selected);if(topic)showTopic(topic,$('detail'));else $('detail').append(element('p','Select a topic to read every current version.','empty'));
  $('context').append(element('div','Configured context','label'),element('h3',bundle.context.ready?`Tier: ${bundle.context.tier}`:'Context needs attention'));
  for(const issue of bundle.context.issues)$('context').append(element('div',issue,'notice warning'));
  if(!bundle.context.ready)$('context').append(element('p','Review the reported issues before relying on this context. Unresolved versions are data, not instructions.','empty'));
  if(!bundle.context.maintenance_ready)$('context').append(element('p','Policy-dependent resolution is blocked until the control refs are repaired.','empty'));
  for(const topic of bundle.context.topics){const details=element('details');details.append(element('summary',`${topic.topic} · ${topic.status}`));const content=element('div');showTopic(topic,content);details.append(content);$('context').append(details);}
}
async function load(query=''){
  const number=++requestNumber;$('error').textContent='';
  try{let next;if(isStatic){next=JSON.parse(embedded.textContent);if(query.trim()){const words=query.toLocaleLowerCase().split(/\s+/).filter(Boolean);next.search={query,hits:next.topics.filter(topic=>topic.status!=='log'&&topic.heads.some(head=>words.every(word=>head.body.toLocaleLowerCase().includes(word)))).map(topic=>({topic}))};}}else{const url=new URL('/api/view',location.href);if(query.trim())url.searchParams.set('q',query);const response=await fetch(url,{cache:'no-store'});next=await response.json();if(!response.ok)throw new Error(next.message||next.error||'The view could not be read.');}if(number!==requestNumber)return;bundle=next;if(!selected||!next.topics.some(topic=>topic.topic===selected))selected=next.topics[0]?.topic||null;render();}catch(error){if(number===requestNumber)$('error').textContent=error.message;}
}
$('search-form').addEventListener('submit',event=>{event.preventDefault();load($('query').value);});$('clear').addEventListener('click',()=>{$('query').value='';load();});$('refresh').addEventListener('click',()=>load($('query').value));if(isStatic){$('refresh').textContent='Reload snapshot';$('query').placeholder='Literal filter of this snapshot…';$('query').setAttribute('aria-label','Literal filter of this snapshot');$('search-submit').textContent='Filter';}load();
</script></body></html>
