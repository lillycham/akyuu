<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>akyuu</title>
<style>
/*AKYUU-FONTS*/
/* The look is the Akyuu Manuscript design system: a chronicler's page in
   indigo ink. Light is the washi (paper) theme, dark the ai (indigo) one.
   One accent, sora, marks what is current; the status colours are shu
   (vermilion: a problem, a planned deletion), matsu (pine: fine) and kin
   (gold: a search hit). */
:root {
  --ai: #f4f2ec; --ai-raised: #ebe7dd; --ink: #0f1a3a; --ink-muted: #4c5878; --ink-dim: #7d88a6;
  --wire: #5b6b8f; --sora: #2a62bd; --fuji: #6a52c9; --on-accent: #f4f2ec;
  --rule: #dde2ec; --rule-page: #e8e8ea; --rule-strong: #c9d1e2; --rule-label: #a9b3c9; --line: #cdd3e0; --control: #727d9c;
  --shu: #b3361f; --matsu: #2a7451; --kin: #f2d67e;
  --glow-accent: none; --glow-ink: none; --glow-filter: none;
  --font-display: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', Georgia, serif;
  --font-mono: 'Spline Sans Mono', ui-monospace, Menlo, monospace;
  /* The names the rest of this sheet uses. */
  --bg: var(--ai); --fg: var(--ink); --muted: var(--ink-muted); --card: var(--ai-raised);
  --accent: var(--sora); --warn: var(--shu); --ok: var(--matsu); --grey: #e1e3ea; --grey-fg: var(--ink-muted);
  --sup: var(--wire); --about: var(--sora); --derived: var(--matsu); --refines: var(--fuji);
  --hit: var(--kin); --planned: var(--shu); --sel: var(--ink);
  font: 13px/1.45 var(--font-mono);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ai: #0a1226; --ai-raised: #101c3c; --ink: #e9eef8; --ink-muted: #9aa8c8; --ink-dim: #56648a;
    --wire: #aebcd8; --sora: #8fc0ff; --fuji: #b3a3f2; --on-accent: #0a1226;
    --rule: #131f3d; --rule-page: #0f1932; --rule-strong: #1a2a52; --rule-label: #2e3f6e; --line: #24345e; --control: #63729a;
    --shu: #ff8a70; --matsu: #86d4a8; --kin: #e8c66a;
    --glow-accent: 0 0 14px rgba(143,192,255,.40); --glow-ink: 0 0 18px rgba(210,225,255,.22); --glow-filter: drop-shadow(0 0 4px rgba(143,192,255,.55));
    --grey: #17244a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
:focus-visible { outline: 1.6px solid var(--sora); outline-offset: 2px; }
header { display: flex; align-items: center; gap: 18px; padding: 8px 16px; border-bottom: 1px solid var(--rule-strong); background: var(--bg); }
header h1 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 24px/1 var(--font-display); letter-spacing: -.005em; }
header h1 .name {
  color: var(--sora); background: linear-gradient(90deg, var(--sora), var(--fuji)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  padding-bottom: 3px; }
.seal { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; transform: rotate(-3.5deg);
  background: linear-gradient(135deg, var(--sora), var(--fuji)); color: var(--on-accent); font: 700 15px/1 var(--font-display); box-shadow: var(--glow-accent); }
nav#tabs { display: flex; flex-wrap: wrap; gap: 2px; }
nav button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-muted); padding: 6px 10px 4px; cursor: pointer; font: inherit; }
nav button:hover { color: var(--fg); }
nav button .folio { font: 700 12px/1 var(--font-display); color: var(--ink-dim); margin-right: 6px; }
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--sora); }
nav button[aria-selected="true"] .folio { color: var(--sora); }
#status { margin-left: auto; color: var(--muted); font-size: 12px; }
#status.bad { color: var(--warn); }
main { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: auto; }
.view[hidden] { display: none; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.toolbar select, .toolbar input, .toolbar button, .panel button, .wpage button {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--control); border-radius: 0; padding: 3px 8px; }
.toolbar input[type=search] { border-radius: 9999px; padding: 4px 14px; }
.toolbar button:hover, .panel button:hover, .wpage button:hover { border-color: var(--sora); color: var(--sora); }
.toolbar input[type=number] { width: 4.5em; }
button { cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1.6px solid var(--sora); color: var(--sora); border-radius: 9999px; padding: 1px 4px 1px 10px; background: var(--bg); box-shadow: var(--glow-accent); }
.chip button { border: none; background: none; padding: 0 4px; color: inherit; }
.notice { padding: 6px 16px; color: var(--muted); font-size: 12.5px; }
.notice.warn { color: var(--warn); }
.notice.warn::before { content: "※ "; }
.canvas { flex: 1; overflow: auto; position: relative; }
svg.graph { display: block; }
svg.graph text { font: 12px var(--font-mono); fill: var(--fg); }
svg.graph .date { fill: var(--ink-dim); font-size: 11px; }
svg.graph .node { cursor: pointer; }
svg.graph .node text.top { font-size: 9.5px; fill: var(--ink-muted); }
svg.graph .node text.line { font: 700 13px var(--font-display); }
svg.graph .node rect.box { stroke: var(--wire); stroke-width: 1.2; }
svg.graph .node .cut { fill: var(--bg); stroke: none; }
svg.graph .node .fold { fill: none; stroke: var(--wire); stroke-width: 1.2; }
svg.graph .node.superseded rect.box { fill: var(--grey); stroke: var(--ink-dim); }
svg.graph .node.superseded .fold { stroke: var(--ink-dim); }
svg.graph .node.superseded text { fill: var(--grey-fg); }
svg.graph .node.missing rect.box, svg.graph .node.pruned rect.box { fill: none; stroke-dasharray: 5 4; stroke-width: 1.5; }
svg.graph .node.missing rect.box { stroke: var(--warn); }
svg.graph .node.pruned rect.box { stroke: var(--ink-dim); }
svg.graph .node.cacheonly rect.box { stroke: var(--warn); stroke-width: 2; }
svg.graph .node.dim { opacity: .18; }
svg.graph .node.nb rect.box { stroke: var(--sora); stroke-width: 1.8; }
svg.graph .node.selected rect.box { stroke: var(--sora); stroke-width: 2.4; filter: var(--glow-filter); }
svg.graph .node.seed rect.box { stroke: var(--sora); stroke-width: 1.8; }
svg.graph .halo { fill: none; stroke: var(--hit); stroke-width: 5; opacity: .85; }
svg.graph .doomed { fill: none; stroke: var(--planned); stroke-width: 2; stroke-dasharray: 3 3; }
svg.graph .edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg.graph .edge.supersedes { stroke: var(--sup); stroke-width: 2.2; }
svg.graph .edge.about { stroke: var(--about); stroke-width: 1.3; stroke-dasharray: 6 4; }
svg.graph .edge.derived-from { stroke: var(--derived); stroke-width: 1.3; stroke-dasharray: 1 4; }
svg.graph .edge.refines { stroke: var(--refines); stroke-width: 1.3; }
svg.graph .edge.dim { opacity: .12; }
svg.graph marker path { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
/* Highlight: the edges of the hovered or selected node are bold, the rest is faint. */
svg.graph.hl .edge { opacity: .08; }
svg.graph .edge.hot { opacity: 1; stroke-width: 2.2; }
svg.graph .edge.supersedes.hot { stroke-width: 3.2; }
svg.graph.hl .edge.hot.dim { opacity: .35; }
svg.graph .reftag rect { fill: var(--bg); stroke: var(--sora); stroke-width: 1.3; filter: var(--glow-filter); }
svg.graph .reftag text { fill: var(--sora); font-size: 10px; font-weight: 500; }
svg.graph .reftag.ghost rect { stroke-dasharray: 3 2; stroke: var(--ink-dim); fill: none; filter: none; }
svg.graph .reftag.ghost text { fill: var(--ink-muted); font-weight: 400; }
svg.graph .rootmark { font-size: 11px; fill: var(--sora); }
svg.graph[data-overview="1"] .node > text:not(.rootmark) { display: none; }
.canvas.panning { cursor: grabbing; user-select: none; }
.zoombar { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; }
.zoombar button { min-width: 2em; }
nav .badge { background: var(--shu); color: var(--on-accent); border-radius: 9999px; padding: 0 6px; font-size: 11px; margin-left: 6px; font-weight: 500; }
.finding h3 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.finding .why { margin: 4px 0 8px; }
.finding .ids { display: flex; flex-direction: column; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 4px 14px 8px; color: var(--muted); font-size: 12px; }
.legend svg { vertical-align: middle; display: inline-block; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: middle; margin-right: 3px; }
aside.panel { width: 380px; flex: none; border-left: 1px solid var(--rule-strong); background: var(--bg); overflow: auto; padding: 12px 16px; }
aside.panel[hidden] { display: none; }
.panel h2 { font: 700 18px/1.3 var(--font-display); margin: 8px 0 6px; word-break: break-all; }
.panel .close { float: right; }
.panel table { border-collapse: collapse; margin: 6px 0; width: 100%; }
.panel td { padding: 2px 6px 2px 0; vertical-align: top; }
.panel td:first-child { color: var(--muted); white-space: nowrap; }
pre.body { white-space: pre-wrap; word-break: break-word; background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; max-height: 45vh; overflow: auto; font: 12.5px/1.5 var(--font-mono); }
.mono { font-family: var(--font-mono); font-size: 12px; }
.link { color: var(--accent); cursor: pointer; }
.link:hover { text-decoration: underline; }
.pill { display: inline-block; border-radius: 0; padding: 0 6px; margin: 0 3px; font-size: 11px; border: 1px solid var(--control); color: var(--muted); }
.pill.good { color: var(--ok); border-color: var(--ok); }
.pill.bad { color: var(--warn); border-color: var(--warn); }
.pad { padding: 10px 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding: 12px 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 12px 14px; min-width: 0; }
.card h3 { margin: 0 0 6px; font: 700 17px/1.3 var(--font-display); }
/* Refs: each card is headed by its ref, drawn as a tag, over its generations. */
#refs-list { align-items: start; }
#refs-list .card { background: var(--bg); border-color: var(--rule-strong); }
#refs-list .card h3 { display: inline-block; margin: 0 0 12px; font: 500 12.5px/1.4 var(--font-mono); color: var(--sora); border: 1.4px solid var(--sora); border-radius: 9999px; padding: 2px 12px; box-shadow: var(--glow-accent); word-break: break-all; }
#refs-list ol.timeline li { margin-bottom: 10px; }
#refs-list .gen { font-size: 11.5px; color: var(--ink-dim); }
#refs-list .gen.now { color: var(--sora); }
#refs-list .line { font: 700 15px/1.35 var(--font-display); color: var(--ink); margin-top: 1px; word-break: break-word; }
#refs-list li.notkept .line { color: var(--ink-muted); font-weight: 400; }
/* Search: each hit a marked line, its snippet in Mincho with the words in gold. */
.pill.now { color: var(--sora); border-color: var(--sora); }
#search-results .hits { margin-top: 6px; }
#search-results .hits > li { position: relative; padding-left: 22px; margin: 0 0 16px; max-width: 48em; }
#search-results .hits > li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 9px; height: 9px; transform: rotate(45deg); border: 1.6px solid var(--sora); background: radial-gradient(var(--sora) 30%, var(--bg) 32%); box-shadow: var(--glow-accent); }
#search-results .hits > li.old::before { border-color: var(--ink-dim); background: var(--bg); box-shadow: none; }
#search-results .snippet { font: 400 17px/1.6 var(--font-display); color: var(--ink); margin-top: 2px; }
#search-results li.old .snippet { color: var(--ink-muted); }
#search-results h3 { font: 500 12px/1.4 var(--font-mono); color: var(--sora); margin: 22px 0 8px; }
#search-results h3::before { content: "※ "; }
ol.timeline { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 1.4px solid var(--wire); }
ol.timeline li { margin: 0 0 6px; padding-left: 8px; position: relative; }
ol.timeline li::before { content: ""; position: absolute; left: -18px; top: 5px; width: 9px; height: 9px; transform: rotate(45deg); background: var(--bg); border: 1.6px solid var(--wire); }
ol.timeline li:first-child::before { border-color: var(--sora); box-shadow: var(--glow-accent); background: radial-gradient(var(--sora) 30%, var(--bg) 32%); }
ol.timeline li.notkept::before { border-color: var(--ink-dim); border-style: dashed; background: var(--bg); box-shadow: none; }
ul.plain, ol.plain { list-style: none; margin: 4px 0; padding: 0; }
ul.plain li, ol.plain li { margin: 2px 0; word-break: break-word; }
.hits li { margin: 0 0 10px; }
mark { background: var(--hit); color: #0a1226; border-radius: 0; padding: 0 1px; }
.muted { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 12px 16px; }
table.list { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.list td, table.list th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.list th { color: var(--muted); font-weight: 500; }
.split .canvas { min-height: 320px; max-height: 65vh; }
/* The wiki: a tree of refs on the left, a centre fold, and the page on
   manuscript paper (genkō yōshi: columns of square cells) on the right. */
#view-wiki { flex-direction: row; }
.wnav { width: 240px; flex: none; overflow: auto; padding: 12px 12px 12px 16px; background: var(--bg); }
.wnav input { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--control); border-radius: 9999px; padding: 4px 12px; margin-bottom: 10px; }
ul.wtree { list-style: none; margin: 0; padding-left: 14px; }
.wnav > ul.wtree { padding-left: 0; }
ul.wtree li { margin: 2px 0; word-break: break-all; }
ul.wtree > li > .muted { color: var(--ink-dim); }
ul.wtree a { text-decoration: none; color: var(--ink-muted); }
ul.wtree a:hover { color: var(--sora); }
ul.wtree a.current { color: var(--sora); font-weight: 500; }
ul.wtree a.current::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px -13px; transform: rotate(45deg); background: var(--sora); box-shadow: var(--glow-accent); }
.wfold { width: 44px; flex: none; border-left: 1px solid var(--rule-strong); border-right: 1px solid var(--rule-strong); display: flex; flex-direction: column; align-items: center; }
.wfold::before { content: ""; width: 100%; height: 30px; margin-top: 28px; background: var(--rule-strong); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 55%, 0 100%); }
.wfold span { writing-mode: vertical-rl; margin-top: 18px; font: 400 15px/1 var(--font-display); letter-spacing: .12em; color: var(--rule-label); }
.wpage {
  flex: 1; overflow: auto; padding: 28px 48px 64px; min-width: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(to bottom, var(--rule-page) 1px, transparent 1px),
    linear-gradient(to right, transparent 12px, var(--rule-page) 12px, var(--rule-page) 13px, transparent 13px, transparent 59px, var(--rule-page) 59px);
  background-size: 60px 48px, 60px 100%;
  background-attachment: local;
}
.wpage h1 { font: 700 40px/1.15 var(--font-display); margin: 4px 0 6px; word-break: break-word; color: var(--ink); text-shadow: var(--glow-ink); }
.wpage h1 .ns { color: var(--ink-dim); text-shadow: none; }
.wpage h1 .leaf {
  color: var(--sora); background: linear-gradient(90deg, var(--sora), var(--fuji)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; }
.wpage .meta { margin: 0 0 22px; font-size: 12.5px; }
.wpage h2 { font: 500 12px/1.4 var(--font-mono); color: var(--sora); margin: 22px 0 8px; }
.wpage h2::before { content: "※ "; }
.md { max-width: 40em; font: 400 18px/1.75 var(--font-display); color: var(--ink); }
.md h1, .md h2, .md h3, .md h4, .md h5 { font: 700 22px/1.3 var(--font-display); margin: 22px 0 8px; color: var(--ink); }
.md h3, .md h4, .md h5 { font-size: 19px; }
.wpage .md h2::before { content: none; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 24px; }
.md li::marker { color: var(--ink-dim); }
.md code { font: 14px var(--font-mono); background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 0 4px; }
.md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 1.4px solid var(--wire); color: var(--ink-muted); }
.md a { color: var(--sora); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.wlinks { max-width: 40em; border-top: 1px solid var(--rule-strong); margin-top: 28px; padding-top: 4px; }
.wlinks ul.plain a { text-decoration: none; }
.wlinks ol.timeline { margin-top: 4px; }
.wlinks ol.timeline button { font-size: 11.5px; padding: 1px 8px; margin-left: 4px; }
ol.timeline.episodes li { margin-bottom: 16px; }
ol.timeline.episodes li > .muted { font-size: 12px; color: var(--ink-dim); }
ol.timeline.episodes .md { font: 700 19px/1.45 var(--font-display); }
ol.timeline.episodes .md p { margin: 2px 0; }
</style>
</head>
<body>
<header>
  <h1><span class="seal" aria-hidden="true">求</span><span class="name">akyuu</span></h1>
  <nav id="tabs" role="tablist">
    <button data-tab="wiki" aria-selected="true"><span class="folio" aria-hidden="true">一</span>Wiki</button>
    <button data-tab="graph"><span class="folio" aria-hidden="true">二</span>Graph</button>
    <button data-tab="refs"><span class="folio" aria-hidden="true">三</span>Refs</button>
    <button data-tab="search"><span class="folio" aria-hidden="true">四</span>Search</button>
    <button data-tab="gc"><span class="folio" aria-hidden="true">五</span>GC</button>
    <button data-tab="check"><span class="folio" aria-hidden="true">六</span>Check<span class="badge" id="check-badge" hidden>0</span></button>
    <button data-tab="health"><span class="folio" aria-hidden="true">七</span>Health</button>
  </nav>
  <span id="status">loading</span>
</header>
<main>
  <section class="view" id="view-wiki">
    <nav class="wnav"><input id="wiki-filter" type="search" placeholder="filter refs" autocomplete="off"><div id="wiki-nav"></div></nav>
    <div class="wfold" aria-hidden="true"><span>幻想郷縁起</span></div>
    <article class="wpage" id="wiki-page"></article>
  </section>
  <section class="view" id="view-graph" hidden>
    <div class="toolbar">
      <label>kind <select id="f-kind"></select></label>
      <label>agent <select id="f-agent"></select></label>
      <label>ref <select id="f-ref"></select></label>
      <label title="Edges away from the start nodes">hops <input id="w-hops" type="number" min="0" max="10" value="2"></label>
      <label title="How many of the newest heads to start from">heads <input id="w-limit" type="number" min="1" max="100000" value="200"></label>
      <label><input id="w-all" type="checkbox"> show all</label>
      <span id="w-focus"></span>
      <label title="Compact stacks short chains in fewer columns, to use the height. By time keeps one column for each chain.">layout <select id="f-layout"><option value="compact">compact</option><option value="time">by time</option></select></label>
      <span class="zoombar" data-for="graph-canvas"><button type="button" data-zoom="out" title="Zoom out">−</button><button type="button" data-zoom="in" title="Zoom in">+</button><button type="button" data-zoom="fit" title="Fit the drawing to the window">Fit</button><button type="button" data-zoom="one" title="Natural size">100%</button><span class="muted" data-zoom-label></span></span>
    </div>
    <div class="notice" id="graph-notice"></div>
    <div class="legend" id="legend"></div>
    <div class="canvas" id="graph-canvas"></div>
  </section>
  <section class="view" id="view-refs" hidden>
    <div class="notice" id="refs-notice"></div>
    <div class="cards" id="refs-list"></div>
  </section>
  <section class="view" id="view-search" hidden>
    <form class="toolbar" id="search-form">
      <input id="s-q" type="search" placeholder="words to find" size="36" autocomplete="off">
      <label>limit <input id="s-limit" type="number" min="1" max="100" value="10"></label>
      <label>hops <input id="s-hops" type="number" min="0" max="5" value="1"></label>
      <button type="submit">Search</button>
      <button type="button" id="s-show">Show hits in the graph</button>
    </form>
    <div class="notice" id="search-notice"></div>
    <div class="pad" id="search-results"></div>
  </section>
  <section class="view" id="view-gc" hidden>
    <div class="toolbar" id="gc-summary"></div>
    <div class="notice" id="gc-notice"></div>
    <div class="legend" id="gc-legend"></div>

<script>
'use strict';

  // Pure helpers. They use no DOM, so node can run them for a check.
  // ---------------------------------------------------------------------

  // The first 12 hex digits of an id, for labels.

  }

    return h >>> 0;
  }

  function kindHue(kind) { return kind == null ? 0 : (hashText(kind) % 360); }

    if (t == null) return null;
    const n = Date.parse(t);
    return isNaN(n) ? null : n;
  }

  // Newest first by created time, then by id. A node with no time goes last.
  function newestFirst(a, b) {
    const ta = timeOf(a.created), tb = timeOf(b.created);
    if (ta !== tb) {
      if (ta == null) return 1;
      if (tb == null) return -1;
      return tb - ta;
    }
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  }

  // The window of a whole graph, as /api/graph makes it. The static export
  // has the whole graph and uses this to show the same window.
  function windowGraph(full, opts) {
    const o = Object.assign({ focus: null, hops: 2, limit: 200, all: false }, opts || {});
    const windowInfo = { focus: o.focus, hops: o.hops, limit: o.limit, all: !!o.all };
    const total = { nodes: full.nodes.length, edges: full.edges.length };
    if (o.all) {
      return { nodes: full.nodes, edges: full.edges, truncated: false, total: total,
               shown: total, seeds: [], window: windowInfo };
    }
    const adj = new Map();
    for (const n of full.nodes) adj.set(n.id, []);
    for (const e of full.edges) {
      if (adj.has(e.src)) adj.get(e.src).push(e.dst);
      if (adj.has(e.dst)) adj.get(e.dst).push(e.src);
    }
    let seeds;
    if (o.focus) {
      seeds = [o.focus];
    } else {
      seeds = full.nodes.filter(n => n.status === 'head').sort(newestFirst).slice(0, o.limit).map(n => n.id);
    }
    const shown = new Set(seeds);
    let frontier = seeds.slice();
    for (let h = 0; h < o.hops && frontier.length; h++) {
      const next = [];
      for (const id of frontier) {
        for (const x of adj.get(id) || []) {
          if (!shown.has(x)) { shown.add(x); next.push(x); }
        }
      }
      frontier = next;
    }
    const nodes = full.nodes.filter(n => shown.has(n.id));
    const edges = full.edges.filter(e => shown.has(e.src) && shown.has(e.dst));

             total: total, shown: { nodes: nodes.length, edges: edges.length },
             seeds: seeds, window: windowInfo };
  }

  // A small binary heap, for the order of the layout.
  function Heap(less) { this.a = []; this.less = less; }

    const a = this.a; a.push(x); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (!this.less(a[i], a[p])) break; [a[i], a[p]] = [a[p], a[i]]; i = p; }
  };
  Heap.prototype.pop = function () {
    const a = this.a; const top = a[0]; const last = a.pop();

        if (r < a.length && this.less(a[r], a[m])) m = r;

  // Order the columns so that the edges are short: the sum over all edges of
  // the distance between their two columns is small. `adj[c]` maps each linked
  // column to the number of edges. This is a linear arrangement problem. Two
  // steps: barycenter sweeps (each column goes to the mean place of its
  // neighbours), then swaps of neighbours that help. The result is never worse
  // than the order in time, and it is the same every time. Returns, for each
  // column, its new place.
  function orderColumns(ncol, adj) {
    const cost = (pos) => {
      let s = 0;
      for (let c = 0; c < ncol; c++) for (const [d, w] of adj[c]) if (d > c) s += w * Math.abs(pos[c] - pos[d]);
      return s;

    for (let sweep = 0; sweep < 10; sweep++) {
      const bary = pos.map((p, c) => {
        let w = 0, s = 0;
        for (const [d, k] of adj[c]) { w += k; s += k * pos[d]; }
        return w ? s / w : p;
      });
      const next = new Array(ncol);
      ids.slice().sort((x, y) => bary[x] - bary[y] || pos[x] - pos[y]).forEach((c, i) => { next[c] = i; });
      pos = next;
      const k = cost(pos);
      if (k < bestCost) { bestCost = k; best = pos.slice(); }

    pos = best.slice();
    const at = new Array(ncol);
    pos.forEach((p, c) => { at[p] = c; });
    for (let pass = 0; pass < 6; pass++) {
      let moved = false;
      for (let i = 0; i + 1 < ncol; i++) {
        const u = at[i], v = at[i + 1];
        let delta = 0;
        for (const [n, w] of adj[u]) if (n !== v) delta += w * (Math.abs(pos[n] - (i + 1)) - Math.abs(pos[n] - i));
        for (const [n, w] of adj[v]) if (n !== u) delta += w * (Math.abs(pos[n] - i) - Math.abs(pos[n] - (i + 1)));
        if (delta < 0) { at[i] = v; at[i + 1] = u; pos[u] = i + 1; pos[v] = i; moved = true; }
      }

    }
    return pos;
  }

  // The layered layout. Edges point from a newer memory to an older one, so
  // the graph is a DAG and needs no force layout:
  //
  // 1. Order: newest first, but a node always comes after every node that
  //    points at it (Kahn's algorithm, with the created time as priority).
  // 2. Chains: a memory and the memory that it supersedes share a lane. In a
  //    fork the first (newest) source keeps the lane, and the other one gets
  //    its own: the fork is a branch.
  // 3. Columns: the chains are packed into columns. Two chains share a
  //    column when their spans in the order do not overlap.
  // 4. Rows: go down the order. A node starts a new row if its column is
  //    taken in the current row, or if it has an edge to a node in it. So
  //    time runs down and every edge points down.
  // 5. Column order: the rows do not depend on which column is which, so the
  //    columns can change places now. Edges between far columns cross more
  //    gutters and more lines. So the columns are ordered to make the edges
  //    short (see orderColumns). A chain stays in its column, and each cell
  //    still holds one node. `opts.reorder === false` skips this step.
  //
  // `opts.maxColumns` makes a compact layout. Step 3 gives one column to each
  // chain that is alive at the same time, and most chains start at the top, so
  // a graph of many short chains is wide and short. With a limit, the chains
  // are stacked in at most that many columns (packChains), between step 4 and
  // step 5, and the graph gets taller and narrower.

  // Stack the chains of a layout in at most K columns.
  //
  // The rows of a chain keep their distances (a chain moves as a whole), so a
  // chain stays in one column and every edge inside it is as it was. A chain
  // moves down until it is below the chain above it in its column, and below
  // each node that points at one of its nodes. The chains are placed in an
  // order where a chain comes after the chains that point at it, so every
  // edge between chains still points down.
  //
  // Two chains that point at each other (an edge each way, in different nodes)
  // cannot be put one under the other. Such a chain, and a chain that cannot
  // be moved because it must stay above a pinned chain, is pinned: it keeps its
  // rows, and so a column of its own (shared only with pinned chains that do
  // not overlap it). The result can have more than K columns then, never fewer
  // rows than the by-time layout needs for them.
  //
  // Returns the new place of each node and the number of columns, or null if
  // the layout needs no packing.
  function packChains(chains, pos, graph, K) {
    const info = chains.map((ids, c) => {
      const rows = ids.map(id => pos.get(id).row);
      const min = Math.min.apply(null, rows);
      return { c: c, ids: ids, rel: rows.map(r => r - min), min: min, len: Math.max.apply(null, rows) - min + 1, off: 0, col: -1 };
    });
    const at = new Map();
    for (const ci of info) ci.ids.forEach((id, i) => at.set(id, { ci: ci, i: i }));
    const into = info.map(() => []), outof = info.map(() => []);
    for (const e of graph.edges) {
      const s = at.get(e.src), d = at.get(e.dst);
      if (!s || !d || s.ci === d.ci) continue;
      outof[s.ci.c].push({ s: s, d: d });
      into[d.ci.c].push({ s: s, d: d });
    }
    // One try with a set of pinned chains. Returns { ok: true } or the chains
    // to pin and try again.
    function attempt(pinned) {
      // The pinned chains: their own rows, columns by their spans.
      const pinCols = [];   // the last row of each pinned column
      for (const ci of info.filter(x => pinned.has(x.c)).sort((a, b) => a.min - b.min || a.c - b.c)) {
        let col = pinCols.findIndex(end => end < ci.min);
        if (col < 0) { col = pinCols.length; pinCols.push(-1); }
        pinCols[col] = ci.min + ci.len - 1;
        ci.off = ci.min; ci.col = col;
      }
      const stackCols = Math.max(1, K - pinCols.length);
      const bottom = new Array(stackCols).fill(-1);
      // Order the others: a chain after the chains that point at it.
      const rest = info.filter(x => !pinned.has(x.c));
      const waiting = new Map(rest.map(ci => [ci.c, new Set(into[ci.c].filter(x => !pinned.has(x.s.ci.c)).map(x => x.s.ci.c)).size]));
      const ready = rest.filter(ci => waiting.get(ci.c) === 0).sort((a, b) => a.min - b.min || a.c - b.c);
      const done = new Set();
      const queue = ready.slice();
      let placed = 0;
      while (queue.length) {
        queue.sort((a, b) => a.min - b.min || a.c - b.c);
        const ci = queue.shift();
        let lb = 0, ub = Infinity;
        for (const x of into[ci.c]) lb = Math.max(lb, x.s.ci.off + x.s.ci.rel[x.s.i] + 1 - ci.rel[x.d.i]);
        for (const x of outof[ci.c]) if (pinned.has(x.d.ci.c)) ub = Math.min(ub, x.d.ci.off + x.d.ci.rel[x.d.i] - 1 - ci.rel[x.s.i]);
        let best = -1, start = Infinity;
        for (let k = 0; k < stackCols; k++) {

        ci.off = start; ci.col = pinCols.length + best;
        bottom[best] = start + ci.len - 1;
        done.add(ci.c); placed++;
        for (const x of outof[ci.c]) {
          const d = x.d.ci;
          if (pinned.has(d.c) || done.has(d.c) || !waiting.has(d.c)) continue;
          const left = new Set(into[d.c].filter(y => !pinned.has(y.s.ci.c) && !done.has(y.s.ci.c)).map(y => y.s.ci.c)).size;

          if (left === 0 && queue.indexOf(d) < 0) queue.push(d);

        // pin them all, so that the work stays small.
        const left = rest.filter(ci => !done.has(ci.c)).sort((a, b) => a.min - b.min || a.c - b.c);
        return { ok: false, pin: tries >= MAX_TRIES ? left.map(ci => ci.c) : [left[0].c] };
      }
      return { ok: true };

    const pinned = new Set();
    for (;;) {
      tries++;

      for (const c of r.pin) pinned.add(c);

    const used = Array.from(new Set(info.map(ci => ci.col))).sort((a, b) => a - b);
    const newCol = new Map(used.map((c, i) => [c, i]));
    const out = new Map();
    let rows = 0;
    for (const ci of info) {
      ci.ids.forEach((id, i) => {
        const row = ci.off + ci.rel[i];
        rows = Math.max(rows, row + 1);
        out.set(id, { col: newCol.get(ci.col), row: row, seq: pos.get(id).seq });
      });
    }
    return { pos: out, columns: used.length, rows: rows };
  }

  function layout(graph, opts) {
    const byId = new Map();
    for (const n of graph.nodes) byId.set(n.id, n);
    const ins = new Map(), outs = new Map();
    for (const n of graph.nodes) { ins.set(n.id, []); outs.set(n.id, []); }
    for (const e of graph.edges) {
      if (!byId.has(e.src) || !byId.has(e.dst) || e.src === e.dst) continue;
      outs.get(e.src).push(e);
      ins.get(e.dst).push(e);
    }
    // 1. order
    const waiting = new Map();
    for (const n of graph.nodes) waiting.set(n.id, new Set(ins.get(n.id).map(e => e.src)).size);
    const heap = new Heap((a, b) => newestFirst(a, b) < 0);
    for (const n of graph.nodes) if (waiting.get(n.id) === 0) heap.push(n);
    const order = [];
    const placed = new Set();
    while (heap.size()) {
      const n = heap.pop();
      if (placed.has(n.id)) continue;
      placed.add(n.id); order.push(n);
      const seen = new Set();
      for (const e of outs.get(n.id)) {
        if (seen.has(e.dst)) continue;
        seen.add(e.dst);
        const w = waiting.get(e.dst) - 1;
        waiting.set(e.dst, w);
        if (w === 0) heap.push(byId.get(e.dst));
      }
    }
    if (order.length < graph.nodes.length) {
      // A cycle cannot happen with content addresses, but do not lose nodes.
      for (const n of graph.nodes.slice().sort(newestFirst)) if (!placed.has(n.id)) { placed.add(n.id); order.push(n); }
    }
    const seq = new Map();
    order.forEach((n, i) => seq.set(n.id, i));
    // 2. chains
    const chainOf = new Map();
    const chains = [];
    for (const n of order) {
      if (!chainOf.has(n.id)) { chainOf.set(n.id, chains.length); chains.push([n.id]); }
      const c = chainOf.get(n.id);
      const olds = outs.get(n.id).filter(e => e.kind === 'supersedes' && !chainOf.has(e.dst))
        .map(e => e.dst).sort((a, b) => seq.get(a) - seq.get(b));
      if (olds.length) { chainOf.set(olds[0], c); chains[c].push(olds[0]); }
    }
    // 3. columns
    const spans = chains.map((ids, c) => {
      let from = Infinity, to = -Infinity;
      for (const id of ids) { const s = seq.get(id); if (s < from) from = s; if (s > to) to = s; }
      return { c: c, from: from, to: to };
    }).sort((a, b) => a.from - b.from || a.c - b.c);
    const colEnd = [];
    const colOfChain = new Map();
    for (const sp of spans) {
      let col = colEnd.findIndex(end => end < sp.from);
      if (col < 0) { col = colEnd.length; colEnd.push(sp.to); } else colEnd[col] = sp.to;
      colOfChain.set(sp.c, col);
    }
    // 4. rows
    const pos = new Map();
    let row = 0, usedCols = new Set(), inRow = new Set();
    for (const n of order) {
      const col = colOfChain.get(chainOf.get(n.id));
      const linked = ins.get(n.id).some(e => inRow.has(e.src));
      if (usedCols.has(col) || linked) { row++; usedCols = new Set(); inRow = new Set(); }
      usedCols.add(col); inRow.add(n.id);
      pos.set(n.id, { col: col, row: row, seq: seq.get(n.id) });
    }
    // 4b. a compact layout: stack the chains in at most maxColumns columns
    let rowsUsed = order.length ? row + 1 : 0;
    let columnsUsed = colEnd.length;
    if (opts && opts.maxColumns >= 1 && colEnd.length > opts.maxColumns && order.length) {
      const packed = packChains(chains, pos, graph, opts.maxColumns);
      // Chains that point at each other stay in their own columns. If that
      // leaves more columns than the limit, the by-time layout is better.
      if (packed.columns <= opts.maxColumns) {
        for (const [id, p] of packed.pos) pos.set(id, p);
        rowsUsed = packed.rows;
        columnsUsed = packed.columns;
      }
    }
    // 5. column order
    const ncol = Math.max(columnsUsed, 1);
    let colAt = null;   // the column that each old column becomes
    if (!(opts && opts.reorder === false) && ncol > 2) {
      const adj = [];
      for (let c = 0; c < ncol; c++) adj.push(new Map());
      for (const e of graph.edges) {
        const a = pos.get(e.src), b = pos.get(e.dst);
        if (!a || !b || a.col === b.col) continue;
        adj[a.col].set(b.col, (adj[a.col].get(b.col) || 0) + 1);
        adj[b.col].set(a.col, (adj[b.col].get(a.col) || 0) + 1);
      }
      colAt = orderColumns(ncol, adj);
      for (const [id, p] of pos) pos.set(id, { col: colAt[p.col], row: p.row, seq: p.seq });
    }
    return { pos: pos, order: order.map(n => n.id), columns: ncol, colAt: colAt,
             rows: rowsUsed, chains: chains };
  }

  // The marks of a snippet are the control characters U+0001 and U+0002, the
  // same as in the text index of the server (snippetOpen and snippetClose in
  // Akyuu.Cache). A square bracket in a body is then plain text, not a mark.
  const MARK_OPEN = '\u0001', MARK_CLOSE = '\u0002';

  // Search the bodies of the static export: every word must be in the body,
  // case does not matter. The snippet marks the words with MARK_OPEN and
  // MARK_CLOSE, like the text index of the server. A mark character in a body
  // becomes U+FFFD, as in the index. Current memories come first.
  function staticSearch(memories, q, limit) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    if (!words.length) return { query: q, matches: [], context: [] };
    for (const id of Object.keys(memories)) {
      const m = memories[id];
      if (!m || typeof m.body !== 'string') continue;
      const body = m.body.replace(/[\u0001\u0002]/g, '\uFFFD');
      const low = body.toLowerCase();
      if (!words.every(w => low.indexOf(w) >= 0)) continue;
      const first = Math.min.apply(null, words.map(w => low.indexOf(w)));
      const from = Math.max(0, first - 40), to = Math.min(body.length, first + 80);
      // One pass over all the words, the longest first, so that a word inside
      // another word, or a word like "b", cannot mark the marks again.
      const re = new RegExp(words.slice().sort((a, b) => b.length - a.length)
        .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
      const snip = body.slice(from, to).replace(re, s => MARK_OPEN + s + MARK_CLOSE);
      const supersededBy = (m.edges || []).filter(e => e.dir === 'in' && e.kind === 'supersedes').map(e => e.id);
      hits.push({ id: id, snippet: (from > 0 ? '...' : '') + snip.replace(/\s+/g, ' ') + (to < body.length ? '...' : ''),
                  supersededBy: supersededBy, created: m.created });
    }
    hits.sort((a, b) => (a.supersededBy.length > 0) - (b.supersededBy.length > 0) || newestFirst(a, b));
    return { query: q, matches: hits.slice(0, limit).map(h => ({ id: h.id, snippet: h.snippet, supersededBy: h.supersededBy })), context: [] };
  }

  // Split a snippet at the marks into plain and marked parts.
  function snippetParts(s) {
    const parts = [];
    const re = /\u0001([^\u0002]*)\u0002/g;
    let last = 0, m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) parts.push({ text: s.slice(last, m.index), mark: false });
      parts.push({ text: m[1], mark: true });
      last = re.lastIndex;
    }
    if (last < s.length) parts.push({ text: s.slice(last), mark: false });
    return parts;
  }

  function ago(ms) {
    const s = Math.round(ms / 1000);
    if (s < 90) return s + ' s';
    if (s < 5400) return Math.round(s / 60) + ' min';
    if (s < 172800) return Math.round(s / 3600) + ' h';
    return Math.round(s / 86400) + ' days';
  }

  // The size of a node and of the grid.
  const NODE_W = 210, NODE_H = 36, ROW_H = 60, LEFT = 96, TOP = 28;

  // The ref tags of one node, in two rows: the current values, and the older
  // generations. At most MAX_GHOSTS older ones are drawn. Then a "+N" tag
  // follows, and its title names the rest.
  const TAG_H = 15, TAG_GAP = 4, MAX_GHOSTS = 2, COL_GAP = 40;
  const tagWidth = (label) => 14 + label.length * 6.1;
  const rowWidth = (row) => row.reduce((s, t) => s + tagWidth(t.label) + TAG_GAP, 0);
  function tagRows(list) {
    const cur = [], old = [];
    for (const m of list) {
      if (m.gen === 0) cur.push({ label: m.name, ghost: false, title: 'ref ' + m.name + ' (current)' });
      else old.push({ label: m.name + '~' + m.gen, ghost: true, title: 'ref ' + m.name + ', generation ' + m.gen + (m.kept ? ' (GC keeps it)' : ' (GC does not keep it)') });
    }
    if (old.length > MAX_GHOSTS) {
      const rest = old.slice(MAX_GHOSTS);
      old.length = MAX_GHOSTS;
      old.push({ label: '+' + rest.length, ghost: true, title: 'more older generations: ' + rest.map(t => t.label).join(', ') });
    }
    return [cur, old];
  }

  // The x position of each column, and the tags of each node.
  //
  // The tags sit to the right of their node. Each column is as wide as its
  // widest tags, so a tag never reaches the memories of the next column.
  // After the tags comes the gutter of the column: COL_GAP of free space, and
  // TRACK more for each track that the routing puts into it (`gutterTracks`).
  // This function is pure: the tests call it with no document.
  function columnGeometry(graph, lay, marks, gutterTracks) {
    const tagsOf = new Map();
    const colW = new Array(lay.columns).fill(NODE_W + COL_GAP);
    for (const n of graph.nodes) {
      const rows = tagRows(marks.get(n.id) || []);
      tagsOf.set(n.id, rows);
      const w = Math.max(rowWidth(rows[0]), rowWidth(rows[1]));
      const p = lay.pos.get(n.id);
      if (w > 0 && p) colW[p.col] = Math.max(colW[p.col], NODE_W + 6 + w + COL_GAP);
    }
    const colX = [], trackX0 = [];
    let acc = LEFT;
    for (let c = 0; c < lay.columns; c++) {
      colX.push(acc);
      // The first track of the gutter: half of COL_GAP after the tags.
      trackX0.push(acc + colW[c] - COL_GAP + COL_GAP / 2 + TRACK / 2);
      acc += colW[c] + ((gutterTracks && gutterTracks[c]) || 0) * TRACK;
    }
    return { colX: colX, trackX0: trackX0, width: acc + COL_GAP, tagsOf: tagsOf };
  }

  // ---- edge routing -------------------------------------------------------
  //
  // Circuit-diagram style: an edge is a chain of horizontal and vertical
  // runs. It never crosses a node box or a ref tag, because it only uses
  //
  // - the GAP between two rows (horizontal runs), and
  // - the GUTTER to the right of a column (vertical runs).
  //
  // Short edges: a clear edge inside one column is a straight line. An edge to
  // the next row is a "Z" in the one gap between the rows. Every other edge
  // leaves the bottom of its source into the gap below the row, runs to a
  // gutter, goes down the gutter, comes back in the gap above the target's
  // row, and goes down into the top of the target. The gutter is the one next
  // to the target column, so the long run is in the gap of the source, where
  // the edges of one node fan out in order.
  //
  // Room: each gutter and each gap has TRACKs, and the geometry grows by
  // TRACK for each track that is used. The work goes in four steps:
  //
  // 1. planRoutes: the kind of each edge, and the track of each gutter run.
  //    Edges whose rows (gaps) do not overlap share a track, so a gutter is
  //    as wide as its most crowded row.
  // 2. columnGeometry: the x positions, which now know the width of gutters.
  // 3. routeEdges: ports, then the tracks of the gaps, then the row y
  //    positions (they grow with the tracks), then the points.
  //
  // The ports of one node side are sorted by the x of the place where the
  // edge goes (the gutter or the other node). Then the edges of one node do
  // not cross each other.
  const TRACK = 6;                 // distance between two tracks
  const GAP_PAD = 12;              // free space above the first track and below the last
  const ROW_GAP = ROW_H - NODE_H;  // a row gap with no track, or with one track
  const CORNER = 6;                // radius of the rounded corners
  const PORT_MAX = 12, PORT_PAD = 12, PIN_STEP = 6;
  const KIND_RANK = { supersedes: 0, about: 1, 'derived-from': 2, refines: 3 };
  const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

  function planRoutes(graph, lay) {
    const colRows = [];
    for (let c = 0; c < lay.columns; c++) colRows.push([]);
    for (const p of lay.pos.values()) colRows[p.col].push(p.row);
    for (const rows of colRows) rows.sort((x, y) => x - y);
    // True when the column has no node in a row strictly between r0 and r1.
    const clear = (col, r0, r1) => {
      const rows = colRows[col];
      let lo = 0, hi = rows.length;
      while (lo < hi) { const m = (lo + hi) >> 1; if (rows[m] <= r0) lo = m + 1; else hi = m; }
      return lo >= rows.length || rows[lo] >= r1;
    };
    const items = [], seen = new Map();
    for (const e of graph.edges) {
      const a = lay.pos.get(e.src), b = lay.pos.get(e.dst);
      if (!a || !b || e.src === e.dst) continue;
      let key = e.src + ' ' + e.kind + ' ' + e.dst;
      const n = seen.get(key) || 0;
      seen.set(key, n + 1);
      if (n) key += ' #' + n;
      const it = { key: key, edge: e, a: a.col, b: b.col, rs: a.row, rt: b.row, type: 'gutter', gutter: -1, track: -1 };
      if (it.rt <= it.rs) it.type = 'odd';            // cannot happen: every edge points down
      else if (it.a === it.b && clear(it.a, it.rs, it.rt)) it.type = 'straight';
      else if (it.rt === it.rs + 1) it.type = 'z';
      else it.gutter = it.a < it.b ? it.b - 1 : it.b;  // next to the target, on the side of the source
      items.push(it);
    }
    // Choose the gutter of each long edge. The default is next to the
    // target, but many edges can end at a few old nodes, and then one gutter
    // would hold hundreds of tracks. So an edge may use another gutter
    // within REACH columns of it, if that one is less busy over the rows of
    // the edge. Long edges go first, because they are the hard ones.
    const REACH = 1;   // how many columns away from the default an edge may go
    const load = new Array(lay.columns).fill(null);
    const loadOf = (c) => load[c] || (load[c] = new Int32Array(Math.max(lay.rows, 1)));
    const long = items.filter(it => it.type === 'gutter')
      .sort((x, y) => (y.rt - y.rs) - (x.rt - x.rs) || cmpStr(x.key, y.key));
    for (const it of long) {
      const c0 = it.gutter;
      let best = c0, bestCost = Infinity;
      for (let d = 0; d <= REACH; d++) {
        for (const c of d === 0 ? [c0] : [c0 - d, c0 + d]) {
          if (c < 0 || c >= lay.columns) continue;
          const l = loadOf(c);
          let m = 0;
          for (let g = it.rs; g < it.rt; g++) if (l[g] > m) m = l[g];
          // A far gutter makes the runs in the gaps longer, and they cross
          // more lines. So move only to relieve a much busier gutter.
          const cost = m + 10 * d;
          if (cost < bestCost) { bestCost = cost; best = c; }
        }
      }
      it.gutter = best;
      const l = loadOf(best);
      for (let g = it.rs; g < it.rt; g++) l[g]++;
    }
    // The tracks of each gutter. A run covers the gaps from the row of the
    // source to the row above the target. The order of the tracks comes from
    // assignLanes, with the crossings that two runs would make.
    const byGutter = new Map();
    for (const it of items) {
      if (it.type !== 'gutter') continue;
      if (!byGutter.has(it.gutter)) byGutter.set(it.gutter, []);
      byGutter.get(it.gutter).push(it);
    }
    const gutterTracks = new Array(lay.columns).fill(0);
    for (const [c, list] of byGutter) {
      // A run lies on the left of the gutter when its node is in a column up to c.
      const nets = list.map(it => ({ it: it, part: 0, lo: it.rs, hi: it.rt - 1, topL: it.a <= c, botL: it.b <= c }));
      const active = (n, g) => n.lo <= g && g <= n.hi;
      // A run from the left crosses the tracks on its left, a run from the
      // right the tracks on its right, where they are active in its gap.
      const cost = (i, j) => // i is left of j
        (!i.topL && active(j, i.lo) ? 1 : 0) + (!i.botL && active(j, i.hi) ? 1 : 0) +
        (j.topL && active(i, j.lo) ? 1 : 0) + (j.botL && active(i, j.hi) ? 1 : 0);
      gutterTracks[c] = assignLanes(nets, 0, (p, q) => [cost(p, q), cost(q, p)]);
      for (const n of nets) n.it.track = n.track;
    }
    return { items: items, gutterTracks: gutterTracks };
  }

  // Put runs in lanes. A run is an interval [lo, hi] of nets (x in a gap,
  // gaps in a gutter). Two runs that are closer than `margin` need two lanes.
  // `pairCost(A, B)` gives [the crossings if A comes first, if B comes first].
  // Lane 0 is the top (or the left). A run that has to come first goes in a
  // lane after every run that has to come before it, and then in the first
  // lane with free room. Returns the number of lanes. Each net gets `.track`.
  function assignLanes(nets, margin, pairCost) {
    const n = nets.length;
    if (!n) return 0;
    nets.sort((p, q) => p.lo - q.lo || p.hi - q.hi || cmpStr(p.it.key, q.it.key) || p.part - q.part);
    const preds = nets.map(() => []), after = nets.map(() => []), open = new Array(n).fill(0);
    for (let i = 0; i < n; i++) {
      const A = nets[i];
      for (let j = i + 1; j < n && nets[j].lo <= A.hi + margin; j++) {
        const c = pairCost(A, nets[j]);
        if (c[0] < c[1]) { after[i].push(j); preds[j].push(i); open[j]++; }
        else if (c[1] < c[0]) { after[j].push(i); preds[i].push(j); open[i]++; }
      }
    }
    // First the runs that nothing has to come before. On a cycle take the
    // run with the fewest open predecessors.
    const done = new Array(n).fill(false), order = [];
    for (let s = 0; s < n; s++) {
      let best = -1;
      for (let i = 0; i < n; i++) if (!done[i] && (best < 0 || open[i] < open[best])) best = i;
      done[best] = true;
      order.push(best);
      for (const j of after[best]) open[j]--;
    }
    const lanes = [], laneOf = new Array(n).fill(-1);
    for (const i of order) {
      const t = nets[i];
      let k = 0;
      for (const p of preds[i]) if (laneOf[p] >= 0) k = Math.max(k, laneOf[p] + 1);
      for (;; k++) {
        if (!lanes[k]) lanes[k] = [];
        if (lanes[k].every(o => o.lo > t.hi + margin || t.lo > o.hi + margin)) break;
      }
      lanes[k].push(t);
      laneOf[i] = k;
      t.track = k;
    }
    return lanes.length;
  }

  // The tracks of one gap. A net is one horizontal run: it comes down from
  // the node above (or from a gutter) at x `u`, runs along its track, and goes
  // down to the node below (or into a gutter) at x `d`. When two runs overlap,
  // the cheaper one goes on top: a net on top crosses the `d` leg of the other
  // net if that leg is in its run, and the other net crosses the `u` leg of
  // the net on top. One more rule is hard: when the `u` of A has the same x as
  // the `d` of B, A must be on top, or the two legs would lie on one line.
  function assignTracks(nets) {
    for (const t of nets) { t.lo = Math.min(t.u, t.d); t.hi = Math.max(t.u, t.d); }
    const inside = (x, t) => x >= t.lo - 0.5 && x <= t.hi + 0.5;
    return assignLanes(nets, TRACK, (A, B) => {
      let aTop = (inside(B.u, A) ? 1 : 0) + (inside(A.d, B) ? 1 : 0);
      let bTop = (inside(A.u, B) ? 1 : 0) + (inside(B.d, A) ? 1 : 0);
      if (Math.abs(A.u - B.d) < 0.5) bTop += 1000;
      if (Math.abs(B.u - A.d) < 0.5) aTop += 1000;
      return [aTop, bTop];
    });
  }

  // Give each edge its route: a list of points {x, y}. `geo` comes from
  // columnGeometry with the gutterTracks of `plan`. The result has the y
  // position of each row (`rowY`), which grows when a gap needs more tracks.
  function routeEdges(graph, lay, geo, plan) {
    plan = plan || planRoutes(graph, lay);
    const items = plan.items;
    const cx = (col) => geo.colX[col] + NODE_W / 2;
    const gutX = (it) => geo.trackX0[it.gutter] + it.track * TRACK;
    // 1. Ports. Each end of an edge has a key: the x of the place where the
    //    edge goes. Sorted by it, the edges of one node side do not cross.
    const bottoms = new Map(), tops = new Map();
    const add = (m, id, o) => { if (!m.has(id)) m.set(id, []); m.get(id).push(o); };
    for (const it of items) {
      let ks = 0, kt = 0;
      if (it.type === 'gutter') ks = kt = gutX(it);
      else { ks = cx(it.b); kt = cx(it.a); }
      add(bottoms, it.edge.src, { it: it, key: ks });
      add(tops, it.edge.dst, { it: it, key: kt });
    }
    const byKind = (p, q) => ((KIND_RANK[p.it.edge.kind] || 9) - (KIND_RANK[q.it.edge.kind] || 9)) || cmpStr(p.it.key, q.it.key);
    // A straight edge needs the same x at both ends, so these ports are
    // pinned to the middle of the box. The other ports are spread: one block
    // that is centred, or (with pinned ports) a block on each side.
    const place = (list, centre, set) => {
      const pinned = list.filter(o => o.it.type === 'straight').sort(byKind);
      const rest = list.filter(o => o.it.type !== 'straight').sort((p, q) => p.key - q.key || byKind(p, q));
      const k = pinned.length, H = NODE_W / 2 - PORT_PAD;
      pinned.forEach((o, i) => set(o.it, centre + (i - (k - 1) / 2) * PIN_STEP));
      if (!k) {
        const m = rest.length;
        const s = Math.min(PORT_MAX, m > 1 ? 2 * H / (m - 1) : PORT_MAX);
        rest.forEach((o, i) => set(o.it, centre + (i - (m - 1) / 2) * s));
      } else {
        const left = rest.filter(o => o.key < centre), right = rest.filter(o => o.key >= centre);
        const half = (k - 1) / 2 * PIN_STEP;
        const s = Math.max(2, Math.min(PORT_MAX, (H - half) / Math.max(left.length, right.length, 1)));
        left.forEach((o, j) => set(o.it, centre - half - (left.length - j) * s));
        right.forEach((o, j) => set(o.it, centre + half + (j + 1) * s));
      }
    };
    for (const [id, list] of bottoms) place(list, cx(lay.pos.get(id).col), (it, x) => { it.sx = x; });
    for (const [id, list] of tops) place(list, cx(lay.pos.get(id).col), (it, x) => { it.tx = x; });
    // 2. The tracks of the gaps. Gap g lies below row g.
    const gapNets = new Map();
    const addNet = (g, net) => { if (!gapNets.has(g)) gapNets.set(g, []); gapNets.get(g).push(net); };
    for (const it of items) {
      if (it.type === 'z') { it.n1 = { it: it, part: 0, u: it.sx, d: it.tx }; addNet(it.rs, it.n1); }
      else if (it.type === 'gutter') {
        it.n1 = { it: it, part: 0, u: it.sx, d: gutX(it) }; addNet(it.rs, it.n1);
        it.n2 = { it: it, part: 1, u: gutX(it), d: it.tx }; addNet(it.rt - 1, it.n2);
      }
    }
    const gapTracks = new Array(Math.max(lay.rows - 1, 0)).fill(0);
    for (const [g, nets] of gapNets) gapTracks[g] = assignTracks(nets);
    // 3. The rows. A gap is ROW_GAP high, and TRACK more for each track after the first.
    const rowY = [TOP];
    for (let r = 0; r + 1 < lay.rows; r++) rowY.push(rowY[r] + NODE_H + ROW_GAP + Math.max(0, gapTracks[r] - 1) * TRACK);
    const trackY = (g, k) => rowY[g] + NODE_H + GAP_PAD + k * TRACK;
    // 4. The points.
    const routes = new Map();
    for (const it of items) {
      const y0 = rowY[it.rs] + NODE_H, y1 = rowY[it.rt];
      let pts;
      if (it.type === 'z') {
        const y = trackY(it.rs, it.n1.track);
        pts = [{ x: it.sx, y: y0 }, { x: it.sx, y: y }, { x: it.tx, y: y }, { x: it.tx, y: y1 }];
      } else if (it.type === 'gutter') {
        const gx = gutX(it), ya = trackY(it.rs, it.n1.track), yb = trackY(it.rt - 1, it.n2.track);
        pts = [{ x: it.sx, y: y0 }, { x: it.sx, y: ya }, { x: gx, y: ya }, { x: gx, y: yb }, { x: it.tx, y: yb }, { x: it.tx, y: y1 }];
      } else pts = [{ x: it.sx, y: y0 }, { x: it.tx, y: y1 }];
      routes.set(it.key, { key: it.key, edge: it.edge, kind: it.edge.kind, type: it.type, points: pts });
    }
    const last = lay.rows ? rowY[lay.rows - 1] + NODE_H : TOP;
    return { routes: routes, rowY: rowY, gapTracks: gapTracks, gutterTracks: plan.gutterTracks, height: last };
  }

  // The SVG path of a route, with rounded corners. At each corner the path
  // stops `r` before it and bends with a quadratic curve to `r` after it.
  // A short run gives less than `r`, so two corners never overlap.
  function roundedPath(points, r) {
    const p = [];
    for (const q of points) { const l = p[p.length - 1]; if (!l || l.x !== q.x || l.y !== q.y) p.push(q); }
    // Drop a point that lies on a straight run.
    const v = [];
    p.forEach((q, i) => {
      if (i > 0 && i < p.length - 1) {
        const a = p[i - 1], b = p[i + 1];
        if ((a.x === q.x && q.x === b.x) || (a.y === q.y && q.y === b.y)) return;
      }
      v.push(q);
    });
    const f = (n) => String(Math.round(n * 10) / 10);
    const pt = (q) => f(q.x) + ',' + f(q.y);
    if (!v.length) return '';
    let d = 'M' + pt(v[0]);
    for (let i = 1; i < v.length - 1; i++) {
      const a = v[i - 1], c = v[i], b = v[i + 1];
      const lin = Math.abs(c.x - a.x) + Math.abs(c.y - a.y), lout = Math.abs(b.x - c.x) + Math.abs(b.y - c.y);
      const rr = Math.min(r, lin / 2, lout / 2);
      const sgn = (n) => (n > 0 ? 1 : n < 0 ? -1 : 0);
      const p1 = { x: c.x - sgn(c.x - a.x) * rr, y: c.y - sgn(c.y - a.y) * rr };
      const p2 = { x: c.x + sgn(b.x - c.x) * rr, y: c.y + sgn(b.y - c.y) * rr };
      d += ' L' + pt(p1) + ' Q' + pt(c) + ' ' + pt(p2);
    }
    if (v.length > 1) d += ' L' + pt(v[v.length - 1]);
    return d;
  }

  // The smallest scale of the drawing. Below it the text cannot be read, so the
  // page does not shrink further: a big graph scrolls.
  const MIN_SCALE = 0.4, MAX_SCALE = 2;
  // Below this scale the page hides the text of the nodes and keeps the boxes,
  // the colours, the tags and the edges: an overview of the shape.
  const OVERVIEW_BELOW = 0.55;

  // The scale that fits a drawing of w by h in a canvas of cw by ch. A drawing
  // that is smaller than the canvas is not enlarged. The result is never
  // below min. A canvas with no size (not shown yet) gives 1.
  function fitScale(w, h, cw, ch, min) {
    if (!(w > 0 && h > 0 && cw > 0 && ch > 0)) return 1;
    return Math.max(min, Math.min(cw / w, ch / h, 1));
  }

  // The scroll position after a change of scale, so that the point of the
  // drawing under p (a distance from the edge of the canvas) stays under p.
  function anchorScroll(scroll, oldScale, newScale, p) {
    return Math.max(0, ((scroll + p) / oldScale) * newScale - p);
  }

  // ---- compare ---------------------------------------------------------------
  // The page does the same comparison as `akyuu compare` (Akyuu.Compare), so
  // that a static export can do it too. test/check-page.js runs the same
  // cases as test/CompareTests.hs.

  // The text in lower case, with white space made one space.
  function normText(t) { return t.toLowerCase().split(/\s+/).filter(Boolean).join(' '); }

  // The sentences of a text: a sentence ends with . ? or ! before white
  // space or the end, or at the end of a line.
  function sentences(text) {
    const out = [];
    for (const line of text.split('\n')) {
      let s = line.trim();
      while (s.length) {
        let i = 0;
        for (; i < s.length; i++) {
          if ('.?!'.indexOf(s[i]) >= 0 && (i + 1 === s.length || /\s/.test(s[i + 1]))) { i++; break; }
        }
        out.push(s.slice(0, i));
        s = s.slice(i).replace(/^\s+/, '');
      }
    }
    return out;
  }

  // The sets of three words in a row. A text of fewer than three words is one item.
  function shingles(norm) {
    const w = norm.split(' ').filter(Boolean);
    const out = new Set();
    if (w.length < 3) { out.add(w.join(' ')); return out; }
    for (let i = 0; i + 2 < w.length; i++) out.add(w[i] + ' ' + w[i + 1] + ' ' + w[i + 2]);
    return out;
  }

  // What two texts share, and the sentences that only one of them has.
  function compareText(a, b) {
    const sa = sentences(a), sb = sentences(b);
    const missing = (have, xs) => {
      const known = new Set(have.map(normText));
      const seen = new Set();
      const out = [];
      for (const x of xs) if (!known.has(normText(x)) && !seen.has(x)) { seen.add(x); out.push(x); }
      return out;
    };
    const A = shingles(normText(a)), B = shingles(normText(b));
    let common = 0;
    for (const x of A) if (B.has(x)) common++;
    const union = A.size + B.size - common;
    const onlyA = missing(sb, sa), onlyB = missing(sa, sb);
    return { shared: union === 0 ? 0 : common / union, onlyA: onlyA, onlyB: onlyB, canDropA: onlyA.length === 0, canDropB: onlyB.length === 0 };
  }

  // ---- wiki: Markdown and links, as data --------------------------------
  // A memory body is untrusted text. These functions turn it into plain data
  // (blocks and inline tokens); the page builds DOM nodes from the data with
  // textContent only. Only a small part of Markdown is read: headings, lists
  // (two levels), fenced code, quotes, rules, paragraphs, `code`, **strong**,
  // *em*, [text](http...) links, bare http(s) URLs, ref names and ids.

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // A matcher for the names of refs in text. A name counts only as a whole
  // word: the characters around it are not part of a name.
  function refMatcher(names) {
    const list = (names || []).filter(n => typeof n === 'string' && n.length).slice().sort((a, b) => b.length - a.length);
    if (!list.length) return null;
    return new RegExp('(^|[^a-z0-9/_.\\-])(' + list.map(escapeRe).join('|') + ')(?![a-z0-9/_\\-]|\\.[a-z0-9])', 'g');
  }
