      for (const o of edgeEls.get(id)) {
        mark(o, 'hot');
        const peer = nodeEls.get(o.src === id ? o.dst : o.src);
        if (peer) mark(peer, 'nb');
      }
    }
    light(state.selected);
    container.appendChild(root);
    // The scale: fitted to the canvas, or the one that the person chose.
    const view = viewOf(container);
    view.natural = { w: width, h: height };
    view.root = root;
    const fit = fitScale(width, height, container.clientWidth, container.clientHeight, MIN_SCALE);
    applyScale(container, view.mode === 'fit' ? fit : view.scale, null);
    if (opts.scrollTo && lay.pos.has(opts.scrollTo)) {
      const p = xy(opts.scrollTo);
      container.scrollTo({ left: Math.max(0, p.x * view.scale - 80), top: Math.max(0, p.y * view.scale - 120) });
    } else if (view.mode === 'fit') {
      container.scrollLeft = 0;
      container.scrollTop = 0;
    } else {
      container.scrollLeft = keep.left;
      container.scrollTop = keep.top;
    }
    return { scale: view.scale, tooBig: width * view.scale > container.clientWidth + 1 || height * view.scale > container.clientHeight + 1 };
  }

  // ---- zoom ------------------------------------------------------------------

  // The view of each canvas: fitted to it, or at a scale that the person chose.
  const views = new Map();
  function viewOf(c) {
    let v = views.get(c);
    if (!v) { v = { mode: 'fit', scale: 1, natural: null, root: null }; views.set(c, v); }
    return v;
  }
  function zoomLabel(c) {
    const v = viewOf(c);
    for (const bar of document.querySelectorAll('.zoombar')) {
      if (bar.dataset.for !== c.id) continue;
      const lab = bar.querySelector('[data-zoom-label]');
      if (lab) lab.textContent = Math.round(v.scale * 100) + '%' + (v.scale < OVERVIEW_BELOW ? ' · overview' : '');
    }
  }
  // Set the scale of the drawing. The drawing keeps its natural viewBox, so
  // the layout and the routes do not change. The point anchor (from the
  // corner of the canvas) stays where it is, if one is given.
  function applyScale(c, scale, anchor) {
    const v = viewOf(c);
    if (!v.natural || !v.root) return;
    const old = v.scale;
    v.scale = scale;
    v.root.setAttribute('width', String(Math.round(v.natural.w * scale)));
    v.root.setAttribute('height', String(Math.round(v.natural.h * scale)));
    v.root.setAttribute('data-overview', scale < OVERVIEW_BELOW ? '1' : '0');
    if (anchor) {
      c.scrollLeft = anchorScroll(c.scrollLeft, old, scale, anchor.x);
      c.scrollTop = anchorScroll(c.scrollTop, old, scale, anchor.y);
    }
    zoomLabel(c);
  }
  function fitCanvas(c) {
    const v = viewOf(c);
    v.mode = 'fit';
    if (!v.natural) return;
    applyScale(c, fitScale(v.natural.w, v.natural.h, c.clientWidth, c.clientHeight, MIN_SCALE), null);
    c.scrollLeft = 0;
    c.scrollTop = 0;
  }
  function zoomTo(c, scale, anchor) {
    const v = viewOf(c);
    v.mode = 'manual';
    applyScale(c, Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale)), anchor || { x: (c.clientWidth || 0) / 2, y: (c.clientHeight || 0) / 2 });
  }
  function bindZoom(c) {
    for (const bar of document.querySelectorAll('.zoombar')) {
      if (bar.dataset.for !== c.id) continue;
      for (const b of bar.querySelectorAll('[data-zoom]')) {
        b.addEventListener('click', () => {
          const v = viewOf(c);
          const how = b.dataset.zoom;
          if (how === 'fit') fitCanvas(c);
          else if (how === 'one') zoomTo(c, 1);
          else zoomTo(c, v.scale * (how === 'in' ? 1.25 : 0.8));
        });
      }
    }
    // ctrl or cmd and the wheel zoom around the pointer. A plain wheel scrolls.
    c.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const r = c.getBoundingClientRect ? c.getBoundingClientRect() : { left: 0, top: 0 };
      zoomTo(c, viewOf(c).scale * Math.exp(-e.deltaY * 0.0015), { x: e.clientX - r.left, y: e.clientY - r.top });
    }, { passive: false });
    // Drag on an empty place to pan. A click on a node still selects it.
    let drag = null;
    c.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.target && e.target.closest && e.target.closest('.node'))) return;
      drag = { x: e.clientX, y: e.clientY, left: c.scrollLeft, top: c.scrollTop };
      c.classList.add('panning');
    });
    c.addEventListener('pointermove', (e) => {
      if (!drag) return;
      c.scrollLeft = drag.left - (e.clientX - drag.x);
      c.scrollTop = drag.top - (e.clientY - drag.y);
    });
    const stop = () => { drag = null; c.classList.remove('panning'); };
    c.addEventListener('pointerup', stop);
    c.addEventListener('pointercancel', stop);
    c.addEventListener('pointerleave', stop);
    // A new size of the canvas (the side panel opens) fits the drawing again.
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { if (viewOf(c).mode === 'fit') fitCanvas(c); }).observe(c);
    }
  }

  function legend(container, graph, extra) {
    container.replaceChildren();
    const kinds = graph ? Array.from(new Set(graph.nodes.map(n => n.kind).filter(Boolean))).sort() : [];
    for (const k of kinds) container.appendChild(el('span', {}, [el('span', { class: 'swatch', style: 'background:' + kindFill(k) }), k]));
    for (const k of Object.keys(EDGE_VAR)) {
      const s = svg('svg', { class: 'graph', width: 34, height: 10 });
      s.appendChild(svg('path', { d: 'M2,5 L32,5', class: 'edge ' + k }));
      container.appendChild(el('span', {}, [s, ' ' + k]));
    }
    container.appendChild(el('span', { text: 'grey: superseded · dashed: pruned or missing target · red outline: only in the cache · tags: refs (dashed: an older value)' }));
    for (const x of extra || []) container.appendChild(x);
  }

  // ---- the graph view -------------------------------------------------------

  function fillSelect(sel, values, current) {
    sel.replaceChildren(el('option', { value: '', text: '(all)' }));
    for (const v of values) {
      const o = el('option', { value: v, text: v });
      if (v === current) o.selected = true;
      sel.appendChild(o);
    }
  }

  function refChain(name) {
    const r = (state.refs && state.refs.refs || []).find(x => x.name === name);
    return r && !r.error ? new Set([r.current].concat(r.history || [])) : new Set();
  }

  function renderGraph(scrollTo) {
    const g = state.graph;
    const notice = $('graph-notice');
    if (!g) return;
    notice.className = 'notice';
    const kinds = Array.from(new Set(g.nodes.map(n => n.kind).filter(Boolean))).sort();
    const agents = Array.from(new Set(g.nodes.map(n => n.agent).filter(Boolean))).sort();
    const refNames = (state.refs && state.refs.refs || []).map(r => r.name);
    fillSelect($('f-kind'), kinds, state.filter.kind);
    fillSelect($('f-agent'), agents, state.filter.agent);
    fillSelect($('f-ref'), refNames, state.filter.ref);
    const focus = $('w-focus');
    focus.replaceChildren();
    if (state.window.focus) {
      focus.appendChild(el('span', { class: 'chip' }, ['focus ', idLink(state.window.focus),
        el('button', { title: 'Clear the focus', text: '×', onclick: () => { state.window.focus = null; loadGraph(); } })]));
    }
    const shown = g.shown || { nodes: g.nodes.length, edges: g.edges.length };
    let text = 'Showing ' + shown.nodes + ' of ' + g.total.nodes + ' nodes and ' + shown.edges + ' of ' + g.total.edges + ' edges';
    if (g.window && !g.window.all) text += g.window.focus ? ', within ' + g.window.hops + ' hops of the focus.' : ', from the ' + g.window.limit + ' newest heads and ' + g.window.hops + ' hops.';
    else text += '.';
    if (g.truncated) text += ' Some nodes are not shown: use "show all", or focus on a node.';
    notice.textContent = text;
    const chain = state.filter.ref ? refChain(state.filter.ref) : null;
    const dim = (n) => (state.filter.kind && n.kind !== state.filter.kind) ||
      (state.filter.agent && n.agent !== state.filter.agent) || (chain && !chain.has(n.id));
    const anyFilter = state.filter.kind || state.filter.agent || state.filter.ref;
    const drawn = drawGraph($('graph-canvas'), g, { marks: refMarks(), seeds: g.seeds, halo: state.hits, dim: anyFilter ? dim : null, scrollTo: scrollTo });
    if (drawn && drawn.tooBig && drawn.scale <= MIN_SCALE + 1e-9 && viewOf($('graph-canvas')).mode === 'fit') {
      notice.textContent += ' The drawing is bigger than the window at the smallest scale (' + Math.round(MIN_SCALE * 100) + '%). Scroll, or use fewer heads or hops, or focus on a node.';
    }
    legend($('legend'), g, state.hits.size ? [el('span', {}, [el('span', { class: 'swatch', style: 'background: var(--hit)' }), 'search hit'])] : []);
  }

  async function loadGraph() {
    try {
      state.graph = await state.src.graph(state.window);
      renderGraph(state.window.focus);
    } catch (e) {
      $('graph-notice').className = 'notice warn';
      $('graph-notice').textContent = 'The graph could not be read: ' + e.message;
    }
  }

  // ---- the side panel ---------------------------------------------------------

  function panel() { const p = $('panel'); p.hidden = false; p.replaceChildren(); return p; }
  function closePanel() { $('panel').hidden = true; state.selected = null; redrawCurrent(); }

  function selectNode(id) {
    state.selected = id;
    if (state.tab === 'gc') showExplain(id); else showMemory(id);
    redrawCurrent();
  }

  function panelHeader(p, title, id) {
    p.appendChild(el('button', { class: 'close', text: 'Close', onclick: closePanel }));
    p.appendChild(el('h2', { text: title }));
    if (id) p.appendChild(el('div', { class: 'mono muted', text: id }));
  }

  async function showMemory(id) {
    const p = panel();
    panelHeader(p, 'Memory ' + shortId(id), id);
    p.appendChild(el('p', { class: 'muted', text: 'loading' }));
    let m;
    try { m = await state.src.memory(id); } catch (e) {
      if (state.selected !== id) return;
      const q = panel();
      panelHeader(q, 'Not a stored memory', id);
      const n = nodeInfo(id);
      if (n && n.status === 'pruned') q.appendChild(el('p', { text: 'GC deleted this memory at ' + fmtTime(n.prunedAt) + '. A newer memory still has an edge to it.' }));
      else if (n && n.status === 'missing') q.appendChild(el('p', { text: 'An edge points here, but the store has no such object and no tombstone. Verify reports this as missing.' }));
      q.appendChild(el('p', { class: 'muted', text: e.message }));
      q.appendChild(actions(id));
      return;
    }
    if (state.selected !== id) return;
    const q = panel();
    panelHeader(q, m.kind + ' by ' + m.agent, m.id);
    const pill = el('span', { class: 'pill' + (m.status === 'head' ? ' good' : ''), text: m.status === 'head' ? 'current' : 'superseded' });
    const refsText = m.refs.length ? m.refs.map(r => r.name + (r.generation ? ' (generation ' + r.generation + ')' : ' (current)')).join(', ') : 'none';
    const rows = [
      ['status', pill],
      ['created', fmtTime(m.created)],
      ['in store since', m.storedAt ? fmtTime(m.storedAt) : '?'],
      ['refs', refsText],
    ];
    const t = el('table');
    for (const [k, v] of rows) t.appendChild(el('tr', {}, [el('td', { text: k }), el('td', {}, [v])]));
    q.appendChild(t);
    q.appendChild(actions(id));
    q.appendChild(el('pre', { class: 'body', text: m.body }));
    q.appendChild(el('h2', { text: 'Edges' }));
    if (!m.edges.length) q.appendChild(el('p', { class: 'muted', text: 'This memory has no edges.' }));
    const ul = el('ul', { class: 'plain' });
    for (const e of m.edges) {
      const n = nodeInfo(e.id);
      ul.appendChild(el('li', {}, [
        el('span', { class: 'muted', text: e.dir === 'out' ? 'this ' + e.kind + ' ' : e.kind + ' this: ' }),
        idLink(e.id), n && n.line ? el('span', { class: 'muted', text: ' ' + n.line.slice(0, 50) }) : null,
        n && (n.status === 'missing' || n.status === 'pruned') ? el('span', { class: 'pill bad', text: n.status }) : null]));
    }
    q.appendChild(ul);
  }

  function actions(id) {
    return el('p', {}, [
      el('button', { text: 'Focus the graph here', onclick: () => { state.window.focus = id; state.window.all = false; $('w-all').checked = false; switchTab('graph'); loadGraph(); } }),
      ' ',
      el('button', { text: 'Why is this alive?', onclick: () => showExplain(id) }),
    ]);
  }

  async function showExplain(id) {
    const p = panel();
    panelHeader(p, 'GC: ' + shortId(id), id);
    let w;
    try { w = await state.src.explain(id); } catch (e) {
      p.appendChild(el('p', { text: e.message }));
      return;
    }
    const verdict = !w.isNode ? 'This is not a memory in the graph.' : w.live ? 'GC keeps it.' : 'Nothing keeps it: the next GC run moves it to trash.';
    p.appendChild(el('p', {}, [el('span', { class: 'pill ' + (w.live ? 'good' : 'bad'), text: w.live ? 'live' : 'garbage' }), ' ' + verdict]));
    if (w.storedAt) p.appendChild(el('p', { class: 'muted', text: 'In the store since ' + fmtTime(w.storedAt) }));
    p.appendChild(el('h2', { text: w.reasons.length ? 'Why it stays' : 'No reason to stay' }));
    const ul = el('ul', { class: 'plain' });
    for (const r of w.reasons) {
      let item = null;
      if (r.reason === 'ref') item = el('li', { text: 'A ref holds it: ' + (r.refs.length ? r.refs.map(x => x.name + (x.generation ? ' (generation ' + x.generation + ')' : ' (current)')).join(', ') : 'a ref value') + '.' });
      else if (r.reason === 'pin') item = el('li', { text: 'It is pinned.' });
      else if (r.reason === 'temp') item = el('li', { text: 'It is a temporary root of the run.' });
      else if (r.reason === 'young') item = el('li', { text: 'It is young: ' + (r.ageSeconds == null ? 'its age is not known' : 'it came into the store ' + ago(r.ageSeconds * 1000) + ' ago') + ', and the grace period is ' + ago(r.gracePeriod * 1000) + '.' });
      else if (r.reason === 'edge') item = el('li', {}, ['The live memory ', idLink(r.from), ' has an ' + r.kind + ' edge to it.']);
      if (item) ul.appendChild(item);
    }
    p.appendChild(ul);
    if (w.path.length) {
      p.appendChild(el('h2', { text: 'One chain from a root' }));
      const ol = el('ol', { class: 'plain' });
      for (const s of w.path) ol.appendChild(el('li', {}, [idLink(s.id), el('span', { class: 'muted', text: ' — ' + s.kind + ' →' })]));
      ol.appendChild(el('li', {}, [idLink(id), el('span', { class: 'muted', text: ' (this one)' })]));
      p.appendChild(ol);
    }
    p.appendChild(el('p', {}, [el('button', { text: 'Show the memory', onclick: () => showMemory(id) })]));
  }

  // ---- refs ------------------------------------------------------------------------

  function renderRefs() {
    const box = $('refs-list');
    box.replaceChildren();
    if (!state.refs) return;
    $('refs-notice').textContent = 'Each ref, newest value first. GC keeps the current value and ' + state.refs.kept + ' older generations.';
    if (!state.refs.refs.length) box.appendChild(el('p', { class: 'muted', text: 'There are no refs.' }));
    for (const r of state.refs.refs) {
      const card = el('div', { class: 'card' }, [el('h3', { text: r.name })]);
      if (r.error) { card.appendChild(el('p', { class: 'pill bad', text: r.error })); box.appendChild(card); continue; }
      const ol = el('ol', { class: 'timeline' });
      [r.current].concat(r.history).forEach((id, gen) => {
        const n = nodeInfo(id);
        const kept = gen <= state.refs.kept;
        ol.appendChild(el('li', { class: kept ? '' : 'notkept' }, [
          el('span', { class: 'gen' + (gen === 0 ? ' now' : ''), text: gen === 0 ? 'current ' : 'generation ' + gen + ' ' }),
          idLink(id),
          n ? el('div', { class: 'line', text: clip(n.line || '', 60) }) : null,
          n && n.status !== 'head' && n.status !== 'superseded' ? el('span', { class: 'pill bad', text: n.status }) : null,
          kept ? null : el('span', { class: 'pill', text: 'GC does not keep it' })]));
      });
      card.appendChild(ol);
      box.appendChild(card);
    }
  }

  // ---- search ----------------------------------------------------------------------

  async function runSearch(ev) {
    if (ev) ev.preventDefault();
    const q = $('s-q').value.trim();
    const out = $('search-results');
    if (!q) return;
    out.replaceChildren(el('p', { class: 'muted', text: 'searching' }));
    let r;
    try { r = await state.src.search(q, Number($('s-limit').value) || 10, Number($('s-hops').value) || 0); }
    catch (e) { out.replaceChildren(el('p', { class: 'pill bad', text: e.message })); return; }
    state.lastSearch = r;
    state.hits = new Set(r.matches.map(m => m.id));
    out.replaceChildren();
    // What the fuzzy step did: a word that the index does not have was searched as a prefix or a near term.
    for (const c of r.corrections || []) {
      if (c.kind === 'meaning') {
        out.appendChild(el('p', { class: 'notice' }, [el('span', { class: 'pill', text: 'by meaning' }), ' ' + c.count + ' of these were found by meaning, not by the words.']));
        continue;
      }
      if (c.kind === 'unavailable') {
        out.appendChild(el('p', { class: 'notice' }, [el('span', { class: 'pill', text: 'text only' }), ' The search by meaning did not run. ' + c.why]));
        continue;
      }
      out.appendChild(el('p', { class: 'notice' }, [el('span', { class: 'pill', text: c.kind === 'prefix' ? 'start of a word' : 'spelling' }),
        ' No word "' + c.word + '", so it was searched as ' + c.used.map(u => '"' + u + '"').join(' or ') + '.']));
    }
    if (!r.matches.length) out.appendChild(el('p', { class: 'muted', text: 'No matches.' }));
    const ul = el('ul', { class: 'plain hits' });
    for (const m of r.matches) {
      const snip = el('div', { class: 'snippet' });
      for (const part of snippetParts(m.snippet)) snip.appendChild(part.mark ? el('mark', { text: part.text }) : document.createTextNode(part.text));
      const li = el('li', {}, [idLink(m.id), m.supersededBy.length ? el('span', { class: 'pill', text: 'old version' }) : el('span', { class: 'pill now', text: 'current' }), snip]);
      if (m.supersededBy.length) li.setAttribute('class', 'old');
      for (const s of m.supersededBy) li.appendChild(el('div', { class: 'muted' }, ['superseded by ', idLink(s)]));
      ul.appendChild(li);
    }
    out.appendChild(ul);
    if (r.context && r.context.length) {
      out.appendChild(el('h3', { text: 'Near the hits (' + r.context.length + ')' }));
      const c = el('ul', { class: 'plain' });
      for (const id of r.context) c.appendChild(el('li', {}, [idLink(id)]));
      out.appendChild(c);
    }
  }

  function searchNotice() {
    const n = $('search-notice');
    n.className = 'notice';
    if (!state.src.live) { n.textContent = 'This is a static export: the page searches the bodies itself. It needs every word, and it does not match word stems.'; return; }
    const s = state.stats;
    if (s && s.cached !== s.memories) {
      n.className = 'notice warn';
      n.textContent = 'The text index (the cache) has ' + s.cached + ' memories, and the store has ' + s.memories + '. This view does not sync the cache. Run akyuu search or akyuu reindex to bring it up to date. See Health.';
    } else n.textContent = 'Search uses the text index of the cache. Current memories come before old versions.';
  }

  // ---- GC ----------------------------------------------------------------------------

  async function loadGC() {
    try {
      const [plan, trash] = await Promise.all([state.src.plan(), state.src.trash()]);
      state.plan = plan;
      state.trash = trash;
      const total = state.graph ? state.graph.total.nodes : 0;
      if (state.graph && (state.graph.window.all || total > GC_ALL_LIMIT)) state.gcGraph = state.graph;
      else state.gcGraph = await state.src.graph({ focus: null, hops: 0, limit: 1, all: true });
      $('gc-notice').textContent = state.gcGraph === state.graph && state.graph && !state.graph.window.all
        ? 'The store is big, so the drawing shows the window of the Graph tab. The lists below have every planned memory.' : '';
      renderGC();
    } catch (e) {
      $('gc-summary').replaceChildren(el('span', { class: 'pill bad', text: 'The GC data could not be read: ' + e.message }));
    }
  }

  function renderGC() {
    const plan = state.plan, trash = state.trash;
    if (!plan) return;
    const doomed = new Set(plan.planned);
    const young = new Set(plan.young);
    const refRoots = new Set(plan.roots.refs), pins = new Set(plan.roots.pins);
    $('gc-summary').replaceChildren(
      el('span', { text: 'A run now (' + fmtTime(plan.now) + ') would collect' }),
      el('span', { class: 'pill ' + (doomed.size ? 'bad' : 'good'), text: String(doomed.size) }),
      el('span', { class: 'muted', text: 'of ' + plan.nodes + ' memories. ' + count(young.size, 'is young', 'are young') + ', ' + count(refRoots.size, 'is held by a ref', 'are held by refs') + ', ' + count(pins.size, 'is pinned', 'are pinned') + '. Policy: keep ' +
        plan.policy.keepGenerations + ' older generations, a grace period of ' + ago(plan.policy.gracePeriod * 1000) + ', trash for ' + ago(plan.policy.trashTTL * 1000) + '.' }));
    legend($('gc-legend'), state.gcGraph, [el('span', { text: 'red dashed: in the plan · ◆ held by a ref · ● pinned · ✦ young. Click a node to see why it stays.' })]);
    const rootMark = (id) => [refRoots.has(id) ? '◆' : '', pins.has(id) ? '●' : '', young.has(id) ? '✦' : ''].join('');
    drawGraph($('gc-canvas'), state.gcGraph, { marks: refMarks(), doomed: doomed, rootMark: rootMark, onClick: (id) => { state.selected = id; showExplain(id); renderGC(); } });
    const lists = $('gc-lists');
    lists.replaceChildren();
    const card = (title, rows, empty, head) => {
      const c = el('div', { class: 'card' }, [el('h3', { text: title + ' (' + rows.length + ')' })]);
      if (!rows.length) { c.appendChild(el('p', { class: 'muted', text: empty })); return c; }
      const t = el('table', { class: 'list' });
      if (head) t.appendChild(el('tr', {}, head.map(h => el('th', { text: h }))));
      for (const r of rows) t.appendChild(el('tr', {}, r.map(x => el('td', {}, [x]))));
      c.appendChild(t);
      return c;
    };
    const shortSpan = (id) => el('span', { class: 'mono', text: shortId(id), title: id });
    lists.appendChild(card('In the plan', plan.planned.map(id => [idLink(id), (nodeInfo(id) || {}).line || '']), 'A run now collects nothing.'));
    if (trash) {
      lists.appendChild(card('Trash', trash.trash.map(t => [shortSpan(t.id), fmtTime(t.movedAt), fmtTime(t.deleteAfter)]), 'The trash is empty.', ['id', 'moved', 'deleted after']));
      lists.appendChild(card('Tombstones', trash.tombstones.map(t => [shortSpan(t.id), fmtTime(t.prunedAt)]), 'GC has deleted nothing yet.', ['id', 'pruned']));
      lists.appendChild(card('Pins', trash.pins.map(t => [idLink(t.id), t.inStore ? 'in the store' : el('span', { class: 'pill bad', text: 'not in the store' })]), 'Nothing is pinned.'));
    }
  }

  // ---- health ------------------------------------------------------------------------

  async function loadHealth() {
    const box = $('health');
    box.replaceChildren(el('p', { class: 'pad muted', text: 'Verify reads and hashes every object. This can take a while on a big store.' }));
    let v;
    try { v = await state.src.verify(); } catch (e) { box.replaceChildren(el('p', { class: 'pill bad', text: e.message })); return; }
    state.verifyFingerprint = state.stats ? state.stats.fingerprint : '';
    $('h-note').textContent = state.src.live ? ' Verified at ' + new Date().toLocaleTimeString() + '.' : ' From the export.';
    box.replaceChildren();
    const list = (title, items, render, emptyText, bad) => {
      const c = el('div', { class: 'card' }, [el('h3', {}, [title + ' ', el('span', { class: 'pill ' + (items.length ? (bad ? 'bad' : '') : 'good'), text: String(items.length) })])]);
      if (!items.length) c.appendChild(el('p', { class: 'muted', text: emptyText }));
      const ul = el('ul', { class: 'plain' });
      for (const x of items.slice(0, 200)) ul.appendChild(el('li', {}, render(x)));
      if (items.length > 200) ul.appendChild(el('li', { class: 'muted', text: '… and ' + (items.length - 200) + ' more' }));
      c.appendChild(ul);
      return c;
    };
    const s = state.stats || {};
    const num = (x) => (x == null ? '?' : String(x));
    box.appendChild(el('div', { class: 'card' }, [
      el('h3', {}, ['Verify ', el('span', { class: 'pill ' + (v.ok ? 'good' : 'bad'), text: v.ok ? 'ok' : 'problems found' })]),
      el('p', { text: 'Checked ' + v.checked + ' objects. The store has ' + v.counts.stored + ' objects and the cache ' + v.counts.cached + ' memories. Refs: ' + num(s.refs) +
        ', pins: ' + num(s.pins) + ', trash: ' + num(s.trash) + ', tombstones: ' + num(s.tombstones) + '.' })]));
    box.appendChild(el('div', { class: 'card' }, [
      el('h3', {}, ['Cache and store ', el('span', { class: 'pill ' + (v.drift.inSync ? 'good' : 'bad'), text: v.drift.inSync ? 'in sync' : 'drift' })]),
      el('p', { class: 'muted', text: v.drift.inSync ? 'The cache has exactly the memories of the store.' :
        'The cache does not match the store. akyuu search, gc and reindex bring it up to date. This view does not.' })]));
    const ids = (x) => [idLink(x)];
    box.appendChild(list('Only in the store, not in the cache', v.drift.storeOnly, ids, 'None.', true));
    box.appendChild(list('Only in the cache, not in the store', v.drift.cacheOnly, ids, 'None.', true));
    box.appendChild(list('Corrupt objects', v.corrupt, ids, 'None: every object hashes to its name.', true));
    box.appendChild(list('Unreadable objects', v.unreadable, (x) => [idLink(x.id), ' ' + x.why], 'None.', true));
    box.appendChild(list('Missing edge targets', v.missing, ids, 'None.', true));
    box.appendChild(list('Pruned edge targets (this is normal)', v.pruned, ids, 'None.', false));
    box.appendChild(list('Bad refs', v.badRefs, (x) => [x.name + ': ' + x.why], 'None.', true));
    box.appendChild(list('Refs to a missing object', v.refsToMissing, (x) => [x.name + ' → ', idLink(x.id)], 'None.', true));
  }

  // ---- check -----------------------------------------------------------------------

  const LEVELS = ['problem', 'suggestion', 'info'];
  const LEVEL_TITLE = { problem: 'Problem', suggestion: 'Suggestion', info: 'Information' };

  // Fetch the report of the check and show the count on the tab. The check
  // reads every body, so the page asks for it only when the store changed.
  async function loadCheck() {
    try { state.check = await state.src.check(); state.checkError = null; }
    catch (e) { state.check = null; state.checkError = e.message; }
    const badge = $('check-badge');
    const problems = state.check ? state.check.findings.filter(f => f.severity === 'problem').length : 0;
    badge.textContent = String(problems);
    badge.hidden = problems === 0;
    renderCheck();
  }

  function renderCheck() {
    const box = $('check-list');
    const summary = $('c-summary');
    box.replaceChildren();
    summary.replaceChildren();
    if (!state.check) {
      summary.textContent = state.checkError || 'No report yet.';
      return;
    }
    const c = state.check;
    const names = c.refs || {};
    const kinds = Array.from(new Set(c.findings.map(f => f.kind))).sort();
    fillSelect($('c-kind'), kinds, state.checkFilter.kind);
    fillSelect($('c-level'), LEVELS, state.checkFilter.level);
    const count = (sev) => c.findings.filter(f => f.severity === sev).length;
    if (!c.findings.length) {
      summary.appendChild(el('span', { class: 'pill good', text: 'all clear' }));
      summary.appendChild(document.createTextNode(' Nothing needs attention. The check looks for stale links, forks, duplicates and memories that nothing keeps.'));
    } else {
      summary.textContent = count('problem') + ' problems, ' + count('suggestion') + ' suggestions, ' + count('info') + ' notes.';
    }
    $('c-note').textContent = state.src.live ? ' The check reads the store and changes nothing.' : ' From the export.';
    const shown = c.findings.filter(f => (!state.checkFilter.kind || f.kind === state.checkFilter.kind) &&
      (!state.checkFilter.level || f.severity === state.checkFilter.level));
    if (c.findings.length && !shown.length) {
      box.appendChild(el('p', { class: 'pad muted', text: 'No finding matches the filter.' }));
      return;
    }
    const withName = (id) => el('span', {}, [idLink(id), names[id] ? el('span', { class: 'muted', text: ' ' + names[id].join(', ') }) : '']);
    for (const sev of LEVELS) {
      for (const f of shown.filter(x => x.severity === sev)) {
        const card = el('div', { class: 'card finding' }, [
          el('h3', {}, [el('span', { class: 'pill ' + (sev === 'problem' ? 'bad' : ''), text: LEVEL_TITLE[sev] }), el('span', { class: 'pill', text: f.kind })]),
          el('p', { class: 'why', text: f.why }),
          el('div', { class: 'ids' }, f.ids.map(withName))]);
        if (f.related.length) card.appendChild(el('div', { class: 'ids' }, [el('span', { class: 'muted', text: 'read instead:' })].concat(f.related.map(withName))));
        // A pair can be compared: both memories, and what only one of them says.
        const pair = f.kind === 'fork' ? f.related : f.ids;
        if ((f.kind === 'near-duplicate' || f.kind === 'duplicate-body' || f.kind === 'fork') && pair.length >= 2) {
          card.appendChild(el('p', {}, [el('button', { type: 'button', text: 'Compare', onclick: () => showCompare(pair[0], pair[1]) })]));
        }
        box.appendChild(card);
      }
    }
  }

  // The side panel for two memories: who they are, how much they share, and the
  // sentences that only one of them has. A memory that has a sentence the other
  // lacks cannot be dropped in favour of the other.
  async function showCompare(a, b) {
    const p = panel();
    panelHeader(p, 'Compare ' + shortId(a) + ' and ' + shortId(b));
    p.appendChild(el('p', { class: 'muted', text: 'loading' }));
    let ma, mb;
    try { [ma, mb] = await Promise.all([state.src.memory(a), state.src.memory(b)]); }
    catch (e) {
      const q = panel();
      panelHeader(q, 'Cannot compare');
      q.appendChild(el('p', { text: e.message }));
      return;
    }
    const c = compareText(ma.body, mb.body);
    const q = panel();
    panelHeader(q, 'Compare ' + shortId(a) + ' and ' + shortId(b));
    const refsOf = (m) => (m.refs || []).filter(r => !r.generation).map(r => r.name);
    const who = (tag, id, m) => el('p', {}, [el('strong', { text: tag + ' ' }), idLink(id),
      el('span', { class: 'muted', text: ' ' + m.kind + ' · ' + m.agent + ' · ' + fmtTime(m.created) + (refsOf(m).length ? ' · ' + refsOf(m).join(', ') : '') })]);
    q.appendChild(who('A', a, ma));
    q.appendChild(who('B', b, mb));
    q.appendChild(el('p', { text: 'They share ' + Math.round(c.shared * 100) + '% of their text (word triples).' }));
    const only = (tag, xs) => {
      q.appendChild(el('h2', { text: 'Only in ' + tag + ' (' + xs.length + ')' }));
      if (!xs.length) q.appendChild(el('p', { class: 'muted', text: 'Nothing: all of its text is in the other memory.' }));
      const ul = el('ul', { class: 'plain' });
      for (const x of xs) ul.appendChild(el('li', { text: x }));
      q.appendChild(ul);
    };
    only('A', c.onlyA);
    only('B', c.onlyB);
    const drop = (from, to, ok) => el('p', {}, [el('span', { class: 'pill ' + (ok ? 'good' : 'bad'), text: ok ? 'can be dropped' : 'cannot be dropped' }),
      ' ' + from + ' ' + (ok ? 'says nothing that ' + to + ' lacks.' : 'has text that ' + to + ' lacks. Merge it or keep both.')]);
    q.appendChild(drop('A', 'B', c.canDropA));
    q.appendChild(drop('B', 'A', c.canDropB));
  }

  // ---- tabs, polling, start ------------------------------------------------------------

  // ---- wiki ---------------------------------------------------------------
  // The refs as pages. The body is Markdown, built as DOM nodes from the data
  // of mdBlocks: no HTML from the store reaches the page.

  function pageNames() { return (state.pages || []).filter(p => !p.error).map(p => p.name); }
  function pageOf(name) { return (state.pages || []).find(p => p.name === name) || null; }
  function holderOf(id) {
    const p = (state.pages || []).find(x => x.id === id);
    return p ? p.name : null;
  }

  function inlineNodes(tokens) {
    const out = [];
    for (const k of tokens) {
      if (k.t === 'text') out.push(document.createTextNode(k.v));
      else if (k.t === 'code') out.push(el('code', { text: k.v }));
      else if (k.t === 'strong') out.push(el('strong', {}, inlineNodes(k.c)));
      else if (k.t === 'em') out.push(el('em', {}, inlineNodes(k.c)));
      else if (k.t === 'ref') out.push(el('a', { class: 'link', href: '#wiki/' + k.name, text: k.v }));
      else if (k.t === 'id') {
        const full = k.id.length === 71 ? k.id : null;
        out.push(full ? idLink(full, shortId(full)) : el('span', { class: 'mono', text: k.id }));
      } else if (k.t === 'link' || k.t === 'url') {
        out.push(el('a', { href: k.href, text: k.v, target: '_blank', rel: 'noopener noreferrer' }));
      }
    }
    return out;
  }

  function blockNodes(blocks) {
    const out = [];
    for (const b of blocks) {
      if (b.t === 'h') out.push(el('h' + Math.min(6, b.level + 1), {}, inlineNodes(b.c)));
      else if (b.t === 'p') out.push(el('p', {}, inlineNodes(b.c)));
      else if (b.t === 'code') out.push(el('pre', { class: 'body', text: b.v }));
      else if (b.t === 'quote') out.push(el('blockquote', {}, inlineNodes(b.c)));
      else if (b.t === 'hr') out.push(el('hr'));
      else if (b.t === 'list') {
        const l = el(b.ordered ? 'ol' : 'ul');
        for (const it of b.items) {
          const li = el('li', {}, inlineNodes(it.c));
          if (it.sub.length) li.appendChild(el('ul', {}, it.sub.map(s => el('li', {}, inlineNodes(s)))));
          l.appendChild(li);
        }
        out.push(l);
      }
    }
    return out;
  }

  async function loadWiki() {
    try { const r = await state.src.pages(); state.pages = r.pages; state.wikiHome = r.home || null; state.pagesError = null; }
    catch (e) { state.pages = []; state.pagesError = e.message; }
    renderWikiNav();
    renderWikiPage();
  }

  function renderWikiNav() {
    const nav = $('wiki-nav');
    nav.replaceChildren();
    if (state.pagesError) { nav.appendChild(el('p', { class: 'notice warn', text: state.pagesError })); return; }
    const f = ($('wiki-filter').value || '').trim().toLowerCase();
    const names = pageNames().filter(n => !f || n.toLowerCase().indexOf(f) >= 0);
    if (!names.length) { nav.appendChild(el('p', { class: 'muted', text: f ? 'No ref matches.' : 'The store has no refs yet.' })); return; }
    function tree(node) {
      const ul = el('ul', { class: 'wtree' });
      for (const c of node.children) {
        const li = el('li');
        if (c.page) {
          const a = el('a', { class: 'link' + (c.path === state.wikiPage ? ' current' : ''), href: '#wiki/' + c.path, text: c.name });
          li.appendChild(a);
        } else li.appendChild(el('span', { class: 'muted', text: c.name + '/' }));
        if (c.children.length) li.appendChild(tree(c));
        ul.appendChild(li);
      }
      return ul;
    }
    nav.appendChild(tree(wikiTree(names)));
  }

  async function renderWikiPage() {
    const art = $('wiki-page');
    const names = pageNames();
    if (!state.wikiPage || !pageOf(state.wikiPage)) {
      // The first page: the first ref of the tier always of the manifest
      // (the server finds it), else the first ref by name.
      state.wikiPage = (state.wikiHome && names.indexOf(state.wikiHome) >= 0 ? state.wikiHome : names[0]) || null;
    }
    art.replaceChildren();
    if (!state.wikiPage) { art.appendChild(el('p', { class: 'muted', text: 'No pages: add a memory under a ref (akyuu add --ref, or akyuu init).' })); return; }
    const p = pageOf(state.wikiPage);
    const name = p.name;
    if (location.hash !== '#wiki/' + name && state.tab === 'wiki') history.replaceState(null, '', '#wiki/' + name);
    // The title: the path of the ref quiet, its last part inked.
    const cut = name.lastIndexOf('/') + 1;
    art.appendChild(el('h1', {}, [el('span', { class: 'ns', text: name.slice(0, cut) }), el('span', { class: 'leaf', text: name.slice(cut) })]));
    if (p.error) { art.appendChild(el('p', { class: 'notice warn', text: p.error })); return; }
    art.appendChild(el('p', { class: 'muted meta' }, [p.kind + ' · by ' + p.agent + ' · ' + fmtTime(p.created) + ' · ', idLink(p.id)]));
    const body = el('div', { class: 'md' }, blockNodes(mdBlocks(p.body, names)));
    art.appendChild(body);
    // Links and backlinks, from the edges of the memory and from the text.
    const side = el('div', { class: 'wlinks' });
    art.appendChild(side);
    let m = null;
    try { m = await state.src.memory(p.id); } catch (e) { m = null; }
    if (state.wikiPage !== name) return;
    const label = (id) => {
      const h = holderOf(id);
      return h ? el('a', { class: 'link', href: '#wiki/' + h, text: h }) : idLink(id);
    };
    if (m) {
      const outs = m.edges.filter(e => e.dir === 'out' && e.kind !== 'supersedes');
      if (outs.length) {
        side.appendChild(el('h2', { text: 'Links to' }));
        side.appendChild(el('ul', { class: 'plain' }, outs.map(e => el('li', {}, [el('span', { class: 'muted', text: e.kind + ' ' }), label(e.id)]))));
      }
    }
    const ins = m ? m.edges.filter(e => e.dir === 'in' && e.kind !== 'supersedes') : [];
    const texts = textBacklinks(state.pages, name);
    side.appendChild(el('h2', { text: 'Linked from' }));
    if (!ins.length && !texts.length) side.appendChild(el('p', { class: 'muted', text: 'Nothing links here.' }));
    else {
      const ul = el('ul', { class: 'plain' });
      for (const e of ins) ul.appendChild(el('li', {}, [label(e.id), el('span', { class: 'muted', text: ' (' + e.kind + ')' })]));
      for (const t of texts) ul.appendChild(el('li', {}, [el('a', { class: 'link', href: '#wiki/' + t, text: t }), el('span', { class: 'muted', text: ' (names it)' })]));
      side.appendChild(ul);
    }
    // History: the older values of the ref, with a comparison to now.
    if (p.history && p.history.length) {
      side.appendChild(el('h2', { text: 'History' }));
      const ol = el('ol', { class: 'timeline' });
      ol.appendChild(el('li', {}, [idLink(p.id), el('span', { class: 'muted', text: ' now' })]));
      for (const h of p.history) {
        ol.appendChild(el('li', {}, [idLink(h), ' ', el('button', { type: 'button', text: 'compare with now', onclick: () => showCompare(h, p.id) })]));
      }
      side.appendChild(ol);
    }
    // A log: its episodes, newest first.
    if (isLogPage(name, p.kind)) {
      side.appendChild(el('h2', { text: 'Episodes' }));
      const ol = el('ol', { class: 'timeline episodes' });
      side.appendChild(ol);
      await showEpisodes(ol, name, p.id, 15);
    }
  }

  // Walk a log from an episode along derived_from, n at a time.
  async function showEpisodes(ol, name, start, n) {
    let id = start;
    for (let k = 0; id && k < n; k++) {
      let m;
      try { m = await state.src.memory(id); } catch (e) { ol.appendChild(el('li', { class: 'notkept' }, [el('span', { class: 'muted', text: 'older episodes are gone (GC) or cannot be read' })])); return; }
      if (state.wikiPage !== name) return;
      ol.appendChild(el('li', {}, [
        el('div', { class: 'muted' }, [fmtTime(m.created) + ' · ' + m.kind + ' · ' + m.agent + ' · ', idLink(m.id)]),
        el('div', { class: 'md' }, blockNodes(mdBlocks(m.body, pageNames())))
      ]));
      const prev = m.edges.find(e => e.dir === 'out' && e.kind === 'derived-from');
      id = prev ? prev.id : null;
    }
    if (id) {
      const more = el('li', {}, [el('button', { type: 'button', text: 'older episodes', onclick: () => { more.remove(); showEpisodes(ol, name, id, n); } })]);
      ol.appendChild(more);
    }
  }

  function openWikiFromHash() {
    const h = location.hash || '';
    if (h.indexOf('#wiki/') === 0) {
      state.wikiPage = decodeURIComponent(h.slice(6));
      if (state.tab !== 'wiki') switchTab('wiki');
      else { renderWikiNav(); renderWikiPage(); }
      $('view-wiki').scrollTop = 0;
      $('wiki-page').scrollTop = 0;
    }
  }

  const TABS = ['wiki', 'graph', 'refs', 'search', 'gc', 'check', 'health'];

  function switchTab(tab) {
    state.tab = tab;
    for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
    for (const v of document.querySelectorAll('.view')) v.hidden = v.id !== 'view-' + tab;
    if (tab === 'wiki') {
      if (state.wikiPage && location.hash !== '#wiki/' + state.wikiPage) history.replaceState(null, '', '#wiki/' + state.wikiPage);
      if (state.pages === null) loadWiki(); else { renderWikiNav(); renderWikiPage(); }
    } else if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
    if (tab === 'gc') loadGC();
    if (tab === 'health' && state.verifyFingerprint === null) loadHealth();
    if (tab === 'check') renderCheck();
    if (tab === 'search') searchNotice();
    if (tab === 'refs') renderRefs();
    if (tab === 'graph') renderGraph();
  }

  function redrawCurrent() {
    if (state.tab === 'graph') renderGraph();
    else if (state.tab === 'gc') renderGC();
  }

  async function refreshAll() {
    try { state.refs = await state.src.refs(); } catch (e) { state.refs = { kept: 0, refs: [] }; }
    await loadGraph();
    await loadCheck();
    if (state.tab === 'refs') renderRefs();
    if (state.tab === 'wiki') await loadWiki(); else state.pages = null;
    if (state.tab === 'gc') await loadGC();
    if (state.tab === 'search') searchNotice();
    if (state.tab === 'health' && state.verifyFingerprint !== null && state.verifyFingerprint !== (state.stats && state.stats.fingerprint)) {
      $('h-note').textContent = ' The store changed after this report. Run verify again to see the change.';
    }
  }

  function firstWindow(s) {
    if (state.stats === null && s && typeof s.memories === 'number') {
      state.window.all = s.memories <= SHOW_ALL_LIMIT;
      $('w-all').checked = state.window.all;
    }
  }

  async function poll() {
    try {
      const s = await state.src.stats();
      firstWindow(s);
      const changed = !state.stats || s.fingerprint !== state.stats.fingerprint;
      state.stats = s;
      setStatus('live · ' + s.memories + ' memories · ' + s.refs + ' refs · checked ' + new Date().toLocaleTimeString());
      if (changed) await refreshAll();
    } catch (e) {
      setStatus('the server is not reachable: ' + e.message, true);
    }
  }

  function init() {
    const dataEl = document.getElementById('akyuu-data');
    state.src = dataEl ? staticSource(JSON.parse(dataEl.textContent)) : liveSource();
    for (const b of document.querySelectorAll('#tabs button')) b.addEventListener('click', () => switchTab(b.dataset.tab));
    $('f-kind').addEventListener('change', (e) => { state.filter.kind = e.target.value; renderGraph(); });
    $('f-agent').addEventListener('change', (e) => { state.filter.agent = e.target.value; renderGraph(); });
    $('f-ref').addEventListener('change', (e) => { state.filter.ref = e.target.value; renderGraph(); });
    $('f-layout').addEventListener('change', (e) => { state.compact = e.target.value === 'compact'; fitCanvas($('graph-canvas')); fitCanvas($('gc-canvas')); redrawCurrent(); });
    const num = (id, lo, hi, d) => { const n = Math.round(Number($(id).value)); return isNaN(n) ? d : Math.min(hi, Math.max(lo, n)); };
    $('w-hops').addEventListener('change', () => { state.window.hops = num('w-hops', 0, 10, 2); loadGraph(); });
    $('w-limit').addEventListener('change', () => { state.window.limit = num('w-limit', 1, 100000, 200); loadGraph(); });
    $('w-all').addEventListener('change', (e) => { state.window.all = e.target.checked; loadGraph(); });
    $('search-form').addEventListener('submit', runSearch);
    $('s-show').addEventListener('click', () => {
      const first = state.lastSearch && state.lastSearch.matches[0];
      switchTab('graph');
      if (first && !(state.graph && state.graph.nodes.some(n => n.id === first.id))) { state.window.focus = first.id; loadGraph(); }
      else if (first) renderGraph(first.id);
    });
    $('h-run').addEventListener('click', loadHealth);
    $('c-run').addEventListener('click', loadCheck);
    $('c-kind').addEventListener('change', (e) => { state.checkFilter.kind = e.target.value; renderCheck(); });
    $('c-level').addEventListener('change', (e) => { state.checkFilter.level = e.target.value; renderCheck(); });
    bindZoom($('graph-canvas'));
    bindZoom($('gc-canvas'));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });
    $('wiki-filter').addEventListener('input', renderWikiNav);
    window.addEventListener('hashchange', openWikiFromHash);
    const start = (location.hash || '#wiki').slice(1);
    if (start.indexOf('wiki/') === 0) state.wikiPage = decodeURIComponent(start.slice(5));
    const first = start.indexOf('wiki/') === 0 ? 'wiki' : TABS.indexOf(start) >= 0 ? start : 'wiki';
    if (state.src.live) {
      poll().then(() => switchTab(first));
      setInterval(poll, 2000);
    } else {
      setStatus('static export, made at ' + fmtTime(state.src.generatedAt));
      state.src.stats().then(s => { firstWindow(s); state.stats = s; }).catch(() => {}).then(refreshAll).then(() => switchTab(first));
    }
  }

  return Object.assign({ init: init }, pure);
})();
if (typeof document !== 'undefined') Akyuu.init();
if (typeof module !== 'undefined') module.exports = Akyuu;
</script>
</body>
</html>
